<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* ぬくもり手帳テーマ: 温かい紙×テラコッタ×丸ゴシック */
  --bg: #FAF3E7;
  --card: #FFFDF8;
  --card-hover: #FFF8EE;
  --text: #3A342B;
  --text-sub: #7A7062;
  --text-muted: #A89C8C;
  --border: rgba(90,70,40,0.10);
  --accent: #C05F38;
  --accent-light: #E8A683;
  --positive: #3E8E5A;
  --negative: #D9704F;
  --warm: #E8B94F;
  --shadow-sm: 0 1px 3px rgba(122,90,50,0.06), 0 1px 2px rgba(122,90,50,0.05);
  --shadow-md: 0 4px 16px rgba(122,90,50,0.10), 0 1px 3px rgba(122,90,50,0.06);
  --shadow-lg: 0 8px 32px rgba(122,90,50,0.14);
  --radius: 20px;
  --radius-sm: 12px;
}

body {
  font-family: 'Zen Maru Gothic', 'Noto Sans JP', 'Meiryo', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  letter-spacing: 0.01em;
}

#root { min-height: 100vh; }

@keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
@keyframes scaleIn { from { opacity:0; transform:scale(0.95); } to { opacity:1; transform:scale(1); } }
@keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-4px); } }
@keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
@keyframes popIn { 0% { transform:scale(0.8); opacity:0; } 60% { transform:scale(1.05); } 100% { transform:scale(1); opacity:1; } }
/* アバター: ゆらゆら呼吸・タップのぷにっと・♪の浮上（GIF不要の生きてる感） */
@keyframes avatarBob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-3px); } }
@keyframes avatarSquish { 0% { transform:scale(1); } 30% { transform:scale(1.1,0.9); } 60% { transform:scale(0.95,1.05); } 100% { transform:scale(1); } }
@keyframes noteFloat { 0% { opacity:0; transform:translateY(2px) scale(0.7); } 25% { opacity:1; } 100% { opacity:0; transform:translateY(-30px) scale(1.15); } }

.fade-up { animation: fadeUp 0.4s cubic-bezier(0.22,1,0.36,1); }
.scale-in { animation: scaleIn 0.3s cubic-bezier(0.22,1,0.36,1); }
.pop-in { animation: popIn 0.4s cubic-bezier(0.22,1,0.36,1); }

/* Gradient text */
.gradient-text {
  background: linear-gradient(135deg, #C05F38, #E8A683, #D98BAF);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* Score slider */
input[type="range"] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 6px;
  border-radius: 3px; outline: none;
  background: linear-gradient(to right, #D9704F, #E8B94F, #E7E0D3, #A3CDA8, #3E8E5A);
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 32px; height: 32px; border-radius: 50%;
  background: white; cursor: pointer;
  box-shadow: 0 2px 12px rgba(192,95,56,0.3), 0 0 0 3px rgba(192,95,56,0.15);
  transition: box-shadow 0.2s;
}
input[type="range"]::-webkit-slider-thumb:hover {
  box-shadow: 0 2px 16px rgba(192,95,56,0.4), 0 0 0 5px rgba(192,95,56,0.12);
}
input[type="range"]::-moz-range-thumb {
  width: 32px; height: 32px; border-radius: 50%; border: none;
  background: white; cursor: pointer;
  box-shadow: 0 2px 12px rgba(192,95,56,0.3), 0 0 0 3px rgba(192,95,56,0.15);
}

.toggle-track { width: 44px; height: 26px; border-radius: 13px; cursor: pointer; position: relative; transition: background 0.3s; }
.toggle-thumb { width: 20px; height: 20px; border-radius: 50%; background: white; position: absolute; top: 3px; transition: transform 0.3s cubic-bezier(0.22,1,0.36,1); box-shadow: 0 1px 4px rgba(0,0,0,0.15); }

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 2px; }
</style>

function toDateString(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function today() { return toDateString(new Date()); }
function formatDateJP(s) { const d=new Date(s); return `${d.getMonth()+1}/${d.getDate()}(${DAY_LABELS[d.getDay()]})`; }
function getCurrentTimeSlot() { const h=new Date().getHours(); if(h>=6&&h<11) return "morning"; if(h>=11&&h<15) return "afternoon"; if(h>=15&&h<19) return "evening"; return "night"; }
function getDaysInMonth(y,m) { return new Date(y,m+1,0).getDate(); }

// Score → color (bright palette)
const SCORE_COLORS = [[-5,"#D9704F"],[-3,"#E89A6B"],[-1,"#E8B94F"],[0,"#B8AE9E"],[1,"#A3CDA8"],[3,"#6FBF8B"],[5,"#3E8E5A"]];
function getScoreColor(score) {
  const c=Math.max(-5,Math.min(5,score));
  for(let i=0;i<SCORE_COLORS.length-1;i++){
    const[sA,cA]=SCORE_COLORS[i],[sB]=SCORE_COLORS[i+1];
    if(c>=sA&&c<=sB){
      const t=(c-sA)/(sB-sA);
      const a=hexToRgb(SCORE_COLORS[i][1]),b=hexToRgb(SCORE_COLORS[i+1][1]);

  "できなかったことより、今日できた小さなことに、目を向けてあげてください。",
  "しんどいときに休むのは、なまけではなく、明日また立つための準備です。",
  "完璧じゃなくていい。あなたは、いるだけで、もう価値があります。",
  "合わなければ、やめて大丈夫。効かなかったのは、あなたのせいではありません。",
];
function pickOmamori(dateStr, score){
  let h = 0; const s = dateStr + String(score);
  for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) >>> 0; }
  return OMAMORI[h % OMAMORI.length];
}

function getScoreFace(s) {
  // Simple geometric faces using CSS
  if(s<=-4) return {mouth:"sad2",eyes:"sad",color:"#D9704F"};
  if(s<=-2) return {mouth:"sad",eyes:"normal",color:"#E89A6B"};
  if(s<=0) return {mouth:"flat",eyes:"normal",color:"#B8AE9E"};
  if(s<=2) return {mouth:"smile",eyes:"normal",color:"#6FBF8B"};
  if(s<=4) return {mouth:"happy",eyes:"happy",color:"#3E8E5A"};
  return {mouth:"grin",eyes:"happy",color:"#3E8E5A"};
}

// Face component
function FaceIcon({score, size=40}) {
  const f = getScoreFace(score);
  const r = size/2;
  const eyeR = size*0.06;
  const eyeY = r*0.7;
  const eyeSpread = r*0.35;
  const mouthY = r*1.2;

  let mouthPath;
  switch(f.mouth) {
    case "grin": mouthPath = `M${r-r*0.35},${mouthY} Q${r},${mouthY+r*0.45} ${r+r*0.35},${mouthY}`; break;
    case "happy": mouthPath = `M${r-r*0.3},${mouthY} Q${r},${mouthY+r*0.35} ${r+r*0.3},${mouthY}`; break;
    case "smile": mouthPath = `M${r-r*0.25},${mouthY} Q${r},${mouthY+r*0.2} ${r+r*0.25},${mouthY}`; break;
    case "flat": mouthPath = `M${r-r*0.2},${mouthY} L${r+r*0.2},${mouthY}`; break;
    case "sad": mouthPath = `M${r-r*0.25},${mouthY+r*0.12} Q${r},${mouthY-r*0.12} ${r+r*0.25},${mouthY+r*0.12}`; break;
    case "sad2": mouthPath = `M${r-r*0.3},${mouthY+r*0.2} Q${r},${mouthY-r*0.2} ${r+r*0.3},${mouthY+r*0.2}`; break;
  }

  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={r} cy={r} r={r-1} fill={f.color} opacity="0.15"/>
      <circle cx={r-eyeSpread} cy={eyeY} r={eyeR} fill={f.color}/>
      <circle cx={r+eyeSpread} cy={eyeY} r={eyeR} fill={f.color}/>
      {f.eyes==="happy" && <>
        <line x1={r-eyeSpread-eyeR*1.2} y1={eyeY-eyeR*0.5} x2={r-eyeSpread} y2={eyeY-eyeR*1.5} stroke={f.color} strokeWidth={1.5} strokeLinecap="round"/>
        <line x1={r-eyeSpread} y1={eyeY-eyeR*1.5} x2={r-eyeSpread+eyeR*1.2} y2={eyeY-eyeR*0.5} stroke={f.color} strokeWidth={1.5} strokeLinecap="round"/>
        <line x1={r+eyeSpread-eyeR*1.2} y1={eyeY-eyeR*0.5} x2={r+eyeSpread} y2={eyeY-eyeR*1.5} stroke={f.color} strokeWidth={1.5} strokeLinecap="round"/>
        <line x1={r+eyeSpread} y1={eyeY-eyeR*1.5} x2={r+eyeSpread+eyeR*1.2} y2={eyeY-eyeR*0.5} stroke={f.color} strokeWidth={1.5} strokeLinecap="round"/>
      </>}
      {f.eyes==="sad" && <>
        <line x1={r-eyeSpread-eyeR*1.2} y1={eyeY-eyeR*1.5} x2={r-eyeSpread+eyeR*1.2} y2={eyeY-eyeR*0.3} stroke={f.color} strokeWidth={1.5} strokeLinecap="round"/>
        <line x1={r+eyeSpread-eyeR*1.2} y1={eyeY-eyeR*0.3} x2={r+eyeSpread+eyeR*1.2} y2={eyeY-eyeR*1.5} stroke={f.color} strokeWidth={1.5} strokeLinecap="round"/>
      </>}
      <path d={mouthPath} fill="none" stroke={f.color} strokeWidth={2} strokeLinecap="round"/>
    </svg>
  );
}

// Analytics
function averageScore(e){if(!e.length)return null; return e.reduce((a,x)=>a+x.score,0)/e.length;}
function averageByTimeSlot(entries){const r={};for(const s of TIME_SLOTS){const se=entries.filter(e=>e.timeSlot===s);r[s]={avg:averageScore(se),count:se.length};}return r;}
function findBestWorst(entries){if(!entries.length)return{best:null,worst:null};let b=entries[0],w=entries[0];for(const e of entries){if(e.score>b.score)b=e;if(e.score<w.score)w=e;}return{best:b,worst:w};}
function generateInsights(entries,prev){
  const ins=[];
  if(!entries.length){ins.push("今週はまだ記録がありません。少しずつ始めてみましょう!");return ins;}
  const rate=Math.round((entries.length/28)*100);
  ins.push(`28スロット中 ${entries.length}スロット記録 — 達成率 ${rate}%`);
  const avg=averageScore(entries);
  if(avg!==null) ins.push(`今週の平均: ${avg>=0?"+":""}${avg.toFixed(1)}`);
  const pAvg=averageScore(prev);
  if(avg!==null&&pAvg!==null){const diff=avg-pAvg;if(Math.abs(diff)>=0.3)ins.push(`前週比 ${diff>0?"+":""}${diff.toFixed(1)} ${diff>0?"UP!":"DOWN"}`);else ins.push("前週とほぼ同じペースです");}
  const bs=averageByTimeSlot(entries);let ws=null,wa=Infinity;for(const s of TIME_SLOTS){if(bs[s].avg!==null&&bs[s].avg<wa){wa=bs[s].avg;ws=s;}}
  if(ws)ins.push(`${TIME_SLOT_CONFIG[ws].label}のスコアが低めの傾向 → 過ごし方を工夫してみては?`);
  return ins;
}

// Storage

const KEYS={entries:"metacog_diary_entries",weeklyNotes:"metacog_weekly_notes",settings:"metacog_settings",stateGuide:"metacog_state_guide",careLog:"metacog_care_log",myCare:"metacog_my_care_items",crisis:"metacog_crisis_contacts",stars:"metacog_stars",unlocks:"metacog_unlocks",avatar:"metacog_avatar",version:"metacog_data_version"};
function sGet(k,fb){try{const r=localStorage.getItem(k);return r===null?fb:JSON.parse(r);}catch{return fb;}}
function sSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){console.error(e);}}
function loadEntries(){return sGet(KEYS.entries,[]);}
function saveEntries(e){sSet(KEYS.entries,e);}
function loadWeeklyNotes(){return sGet(KEYS.weeklyNotes,{});}
function saveWeeklyNotes(n){sSet(KEYS.weeklyNotes,n);}
function loadSettings(){return sGet(KEYS.settings,{userName:"",notificationsEnabled:false});}
function saveSettings(s){sSet(KEYS.settings,s);}
function loadStateGuide(){const raw=sGet(KEYS.stateGuide,null);if(!raw)return cloneDefaultGuide();const merged=cloneDefaultGuide();for(const k of STATE_KEYS){if(raw[k])merged[k]={title:raw[k].title??merged[k].title,behavior:raw[k].behavior??merged[k].behavior,selfCare:Array.isArray(raw[k].selfCare)?raw[k].selfCare.filter(s=>typeof s==='string'):merged[k].selfCare};}return merged;}
function saveStateGuide(g){sSet(KEYS.stateGuide,g);}
// careLog: {id, date, itemId(ライブラリid or "my:xx" or "guide"), text, effect: null|"good"|"soso"|"bad", score}
function loadCareLog(){return sGet(KEYS.careLog,[]);}
function saveCareLog(l){sSet(KEYS.careLog,l);}
// myCare: 自分で追加したケア {id, text, cat, scene}
function loadMyCare(){return sGet(KEYS.myCare,[]);}
function saveMyCare(m){sSet(KEYS.myCare,m);}
// crisis: 相談先（本体には書かず本人が入れる）
function loadCrisis(){return sGet(KEYS.crisis,{staff:"",doctor:"",hotline:""});}
function saveCrisis(c){sSet(KEYS.crisis,c);}
// stars: 星（加算のみ・失効なし。earned=集めた数, spent=つかった数, log=付与済みスロット"date:slot"）
function loadStars(){const s=sGet(KEYS.stars,null);return s&&typeof s.earned==="number"?{earned:s.earned,spent:typeof s.spent==="number"?s.spent:0,log:Array.isArray(s.log)?s.log:[]}:{earned:0,spent:0,log:[]};}
function saveStars(s){sSet(KEYS.stars,s);}
// unlocks: 図鑑で解放したキャラid
function loadUnlocks(){const u=sGet(KEYS.unlocks,[]);return Array.isArray(u)?u.filter(x=>typeof x==="string"):[];}
function saveUnlocks(u){sSet(KEYS.unlocks,u);}
// avatar: 分身（なまえ＋すがたkind。旧版に戻しても無視されるだけ）
function loadAvatar(){const a=sGet(KEYS.avatar,null);if(!a||typeof a!=="object")return{name:"",kind:"a"};return{name:typeof a.name==="string"?a.name:"",kind:["a","b","c"].includes(a.kind)?a.kind:"a"};}

// AI分析用テキスト生成
function formatForAI(entries, stateGuide){
  const sorted = [...entries].sort((a,b)=>a.date.localeCompare(b.date)||TIME_SLOTS.indexOf(a.timeSlot)-TIME_SLOTS.indexOf(b.timeSlot));
  const dateGroups = {};
  for(const e of sorted){
    if(!dateGroups[e.date]) dateGroups[e.date]=[];
    dateGroups[e.date].push(e);
  }

  let out = `# きもち日記データ（AI分析用）\n`;
  out += `エクスポート日時: ${new Date().toLocaleString("ja-JP")}\n`;
  out += `記録件数: ${entries.length}件\n\n`;

  // 状態表
  out += `## じぶんの状態表（-5〜+5）\n`;
  out += `| スコア | 状態 | 行動の様子 | セルフケア |\n`;
  out += `|--------|------|------------|------------|\n`;
  for(const k of STATE_KEYS){
    const g = (stateGuide && stateGuide[k]) || DEFAULT_STATE_GUIDE[k];
    out += `| ${k.padStart(3)} | ${g.title} | ${g.behavior} | ${g.selfCare.join("／")} |\n`;
  }
  out += `\n`;

  // 日別データ
  out += `## 日別の記録\n`;
  for(const[date,es] of Object.entries(dateGroups)){
    const d = new Date(date);
    const avg = averageScore(es);
    out += `### ${date}（${DAY_LABELS[d.getDay()]}）平均: ${avg!==null?(avg>=0?"+":"")+avg.toFixed(1):"---"}\n`;
    for(const e of es){
      const cfg = TIME_SLOT_CONFIG[e.timeSlot];
      out += `- ${cfg.label}（${cfg.timeRange}）: ${e.score>=0?"+":""}${e.score}`;
      if(e.comment) out += ` 「${e.comment}」`;
      if(Array.isArray(e.visitors)&&e.visitors.length) out += ` 来た子: ${e.visitors.map(id=>{const c=charById(id);return c?`${c.name}(${c.feeling})`:id;}).join("・")}`;
      out += `\n`;
    }
    out += `\n`;
  }

  // 集計
  if(entries.length > 0){
    const totalAvg = averageScore(entries);
    const bySlot = averageByTimeSlot(entries);
    out += `## 集計\n`;
    out += `- 全体の平均: ${totalAvg!==null?(totalAvg>=0?"+":"")+totalAvg.toFixed(2):"---"}\n`;
    for(const s of TIME_SLOTS){
      const a = bySlot[s];
      out += `- ${TIME_SLOT_CONFIG[s].label}の平均: ${a.avg!==null?(a.avg>=0?"+":"")+a.avg.toFixed(2):"---"}（${a.count}件）\n`;
    }
    out += `\n`;
  }

  out += `---\n`;
  out += `このデータをもとに、以下のような分析・可視化ができます：\n`;
  out += `・時系列グラフ（日別 / 週別の推移）\n`;
  out += `・時間帯別の傾向分析\n`;
  out += `・コメントの感情分析\n`;
  out += `・セルフケア提案の改善\n`;
  out += `・気分の波のパターン発見\n`;

  return out;
}

const DiaryCtx=createContext();
function diaryReducer(state,action){
  switch(action.type){
    case "ADD_ENTRY":{
      const entries=[...state.entries,action.entry];saveEntries(entries);
      // 星: 新規記録で+1（同じ日×時間帯には1回だけ。加算のみ・へらない）
      const slotKey=action.entry.date+":"+action.entry.timeSlot;
      if(!state.stars.log.includes(slotKey)){
        const stars={...state.stars,earned:state.stars.earned+1,log:[...state.stars.log,slotKey]};
        saveStars(stars);
        return{...state,entries,stars,starPulse:Date.now()};
      }
      return{...state,entries};
    }
    case "UPDATE_ENTRY":{const entries=state.entries.map(e=>e.id===action.entry.id?action.entry:e);saveEntries(entries);return{...state,entries};}
    case "DELETE_ENTRY":{const entries=state.entries.filter(e=>e.id!==action.id);saveEntries(entries);return{...state,entries};}
    case "SET_WEEKLY_NOTE":{const wn={...state.weeklyNotes,[action.weekKey]:action.note};saveWeeklyNotes(wn);return{...state,weeklyNotes:wn};}
    case "UPDATE_SETTINGS":{const s={...state.settings,...action.settings};saveSettings(s);return{...state,settings:s};}
    case "UPDATE_STATE_GUIDE":{const g={...state.stateGuide,[action.key]:{...state.stateGuide[action.key],...action.patch}};saveStateGuide(g);return{...state,stateGuide:g};}
    case "RESET_STATE_GUIDE":{const g=cloneDefaultGuide();saveStateGuide(g);return{...state,stateGuide:g};}
    case "ADD_CARE_LOG":{const careLog=[...state.careLog,action.log];saveCareLog(careLog);return{...state,careLog};}
    case "SET_CARE_EFFECT":{const careLog=state.careLog.map(l=>l.id===action.id?{...l,effect:action.effect}:l);saveCareLog(careLog);return{...state,careLog};}
    case "DELETE_CARE_LOG":{const careLog=state.careLog.filter(l=>l.id!==action.id);saveCareLog(careLog);return{...state,careLog};}
    case "ADD_MY_CARE":{const myCare=[...state.myCare,action.item];saveMyCare(myCare);return{...state,myCare};}
    case "DELETE_MY_CARE":{const myCare=state.myCare.filter(m=>m.id!==action.id);saveMyCare(myCare);return{...state,myCare};}
    case "UPDATE_CRISIS":{const crisis={...state.crisis,...action.crisis};saveCrisis(crisis);return{...state,crisis};}
    case "UNLOCK_CHAR":{
      // 図鑑解放: 星をつかう（earnedは絶対に減らない。spentが増えるだけ）
      if(state.unlocks.includes(action.id))return state;
      if(state.stars.earned-state.stars.spent<UNLOCK_COST)return state;
      const stars={...state.stars,spent:state.stars.spent+UNLOCK_COST};saveStars(stars);
      const unlocks=[...state.unlocks,action.id];saveUnlocks(unlocks);
      return{...state,stars,unlocks};
    }
    case "UPDATE_AVATAR":{const avatar={...state.avatar,...action.avatar};saveAvatar(avatar);return{...state,avatar};}
    case "OPEN_SITUATION":return{...state,activeTab:"selfcare",pendingSit:action.sit};
    case "CLEAR_PENDING_SIT":return{...state,pendingSit:null};
    case "SET_TAB":return{...state,activeTab:action.tab};
    case "LOAD":return{...state,entries:action.entries,weeklyNotes:action.weeklyNotes,settings:action.settings,stateGuide:action.stateGuide,careLog:action.careLog,myCare:action.myCare,crisis:action.crisis,stars:action.stars,unlocks:action.unlocks,avatar:action.avatar};
    default:return state;
  }
}

// 提案エンジン：スコア×実績（効いた記録）でライブラリから選ぶ
// ═══════════════════════════════════════
function effectScore(itemId, careLog){
  // 効いた=+2 / まあまあ=+1 / 合わなかった=-2（直近ほど重く）
  let s = 0;
  const logs = careLog.filter(l=>l.itemId===itemId && l.effect);
  logs.slice(-10).forEach((l,i)=>{
    const w = 1 + i*0.1;
    if(l.effect==="good") s += 2*w;
    else if(l.effect==="soso") s += 1*w;
    else if(l.effect==="bad") s -= 2*w;
  });
  return s;
}
function suggestCare(score, careLog, myCare, count=4, visitorIds=[]){
  // 訪問者（感情キャラ）が選ばれた日は、その子に対応する状況のケアを優先（感情⇔セルフケアの結節点）
  const visSits=new Set((visitorIds||[]).flatMap(id=>{const v=charById(id);return(v&&v.sit)?v.sit:[];}));
  let inRange = CARE_ITEMS.filter(it=>score>=it.states[0]&&score<=it.states[1]&&!it.noSuggest);
  // 深い低調(-4以下)では「考える」系は機能しない——体からのみ
  if(score<=-4) inRange = inRange.filter(it=>it.cat!=="think");
  // 上がりすぎ(+4以上)では活動を煽る項目を出さない（睡眠と鎮静を守る）
  if(score>=4) inRange = inRange.filter(it=>!it.hype);
  const my = (myCare||[]).map(m=>({...m, id:"my:"+m.id, states:[-5,5], my:true}));
  // きょう「やった」ものは並べ替えで消さず、必ず先頭に残す
  // （順位が下がって行ごと消えると、取り消しも「効いた？」の選び直しもできなくなるため）
  const doneIds = new Set((careLog||[]).filter(l=>l.date===today()).map(l=>l.itemId));
  const done = [...CARE_ITEMS, ...my].filter(it=>doneIds.has(it.id));
  const pool = [...inRange, ...my].filter(it=>!doneIds.has(it.id));
  // スコア帯ごとの優先: 低い時=体から / ふつう=気持ち・学習 / 良い時=キープと貯金
  const catPriority =
    score<=-4 ? {now:0,feel:1,base:2,fit:3,joy:4,think:9}
    : score<=-2 ? {now:0,base:1,feel:2,joy:3,fit:4,think:5}
    : score<=0  ? {feel:0,base:1,think:2,joy:3,fit:4,now:5}
    : score<=2  ? {joy:0,base:1,fit:2,feel:3,think:4,now:5}
    : {fit:0,base:1,joy:2,now:3,feel:4,think:5};
  // 低調時は選ぶこと自体が負荷——3つまでに絞る
  const limit = score<=-3 ? Math.min(count,3) : count;
  const scored = pool.map(it=>({
    it,
    // +4以上では「上がりすぎ専用」項目（states下限が+3以上）を最優先に浮かせる
    key: (it.my?1:0)*5 + effectScore(it.id,careLog)*10 - (catPriority[it.cat]??2)
      + (score>=4 && it.states && it.states[0]>=3 ? 8 : 0)
      + (visSits.size && it.sit && it.sit.some(s=>visSits.has(s)) ? 6 : 0)
  }));
  scored.sort((a,b)=>b.key-a.key);
  // 同カテゴリばかりにならないよう軽く分散
  const out=[]; const usedCat={};
  for(const s of scored){
    if(out.length>=limit) break;
    const c=s.it.cat||"my";
    if((usedCat[c]||0)>=2 && scored.length>limit) continue;
    usedCat[c]=(usedCat[c]||0)+1;
    out.push(s.it);
  }
  return [...done, ...out];
}
function isLowStreak(entries, days=2, threshold=-3){
  // 直近days日の平均がthreshold以下の日が続いているか
  let streak=0;
  for(let i=0;i<days;i++){
    const d=new Date(); d.setDate(d.getDate()-i);
    const ds=toDateString(d);
    const avg=averageScore(entries.filter(e=>e.date===ds));
    if(avg!==null && avg<=threshold) streak++;
  }
  return streak>=days;
}

}

function StateCard({score, compact=false}){
  const{state}=useDiaryCtx();
  const g = lookupStateGuide(state.stateGuide, score);
  if(!g) return null;
  const color = getScoreColor(score);
  const rgbMatch = color.match(/\d+/g);
  const rgbStr = rgbMatch ? rgbMatch.slice(0,3).join(",") : "108,92,231";
  return (
    <div style={{
      marginTop: compact?12:16,
      padding: compact?14:16,
      borderRadius:14,
      background:`linear-gradient(135deg, rgba(${rgbStr},0.10), rgba(${rgbStr},0.04))`,
      border:`1px solid rgba(${rgbStr},0.25)`
    }}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>

// 今日の手当て：提案 →「やった」→ 効いた？ のループ
// ═══════════════════════════════════════
function CareItemRow({item, careLog, dispatch, score, compact=false}){
  const cat = CARE_CATEGORIES[item.cat] || {label:"じぶん", color:"var(--accent)", icon:"⭐"};
  const todayStr = today();
  const log = careLog.find(l=>l.date===todayStr && l.itemId===item.id);
  const doIt=()=>{
    dispatch({type:"ADD_CARE_LOG",log:{id:crypto.randomUUID(),date:todayStr,itemId:item.id,text:item.text,effect:null,score:score??null,createdAt:new Date().toISOString()}});
  };
  // 「やった」も「効いた？」も、いつでも取り消し・選び直しができる（押し間違いを責めない）
  const undoIt=()=>{ if(log) dispatch({type:"DELETE_CARE_LOG",id:log.id}); };
  const setEffect=(effect)=>{ if(log) dispatch({type:"SET_CARE_EFFECT",id:log.id,effect:log.effect===effect?null:effect}); };
  return(
    <div style={{padding:compact?"8px 0":"10px 0",borderBottom:"1px solid var(--border)"}}>
      <div style={{display:"flex",gap:8,alignItems:"flex-start"}}>
        <span style={{fontSize:13,flexShrink:0,marginTop:1}}>{cat.icon}</span>
        <div style={{flex:1,minWidth:0}}>
          <p style={{fontSize:13.5,color:"var(--text)",lineHeight:1.6,margin:0}}>{item.text}</p>
          {item.detail && <p style={{fontSize:11.5,color:"var(--text-muted)",lineHeight:1.55,margin:"3px 0 0"}}>{item.detail}</p>}
          {item.note && <p style={{fontSize:11,color:"#B07A2E",lineHeight:1.55,margin:"3px 0 0"}}>⚠ {item.note}</p>}
        </div>
        {!log ? (
          <button onClick={doIt} style={{...S.btn,flexShrink:0,fontSize:12,fontWeight:700,padding:"7px 14px",borderRadius:16,background:"rgba(192,95,56,0.1)",color:"var(--accent)",border:"1px solid rgba(192,95,56,0.18)"}}>やった</button>
        ):(
          <div style={{display:"flex",gap:3,alignItems:"center",flexShrink:0}}>
            <span className="pop-in" style={{fontSize:11,fontWeight:800,color:"var(--positive)",background:"rgba(62,142,90,0.12)",borderRadius:14,padding:"6px 11px"}}>✓ できた</span>
            <button onClick={undoIt} aria-label="「やった」を取り消す" title="取り消す" style={{...S.btn,fontSize:11,color:"var(--text-muted)",background:"transparent",padding:"6px 5px",lineHeight:1}}>↩</button>
          </div>
        )}
      </div>
      {log && (
        <div className="fade-up" style={{display:"flex",gap:6,alignItems:"center",marginTop:8,marginLeft:21,flexWrap:"wrap"}}>
          <span style={{fontSize:10.5,color:"var(--text-sub)"}}>効いた？</span>
          {[["good","○ 効いた","var(--positive)"],["soso","△ まあまあ","#B07A2E"],["bad","× 合わない","var(--text-muted)"]].map(([k,l,c])=>{
            const on=log.effect===k;
            return(
              <button key={k} onClick={()=>setEffect(k)} aria-pressed={on}
                style={{...S.btn,fontSize:10.5,fontWeight:on?800:600,padding:"4px 9px",borderRadius:12,
                  background:on?"rgba(62,142,90,0.10)":"var(--card)",
                  border:on?"1.5px solid "+c:"1px solid var(--border)",color:c}}>{l}</button>
            );
          })}
        </div>
      )}
      {log && log.effect && (
        <p style={{fontSize:10.5,color:"var(--text-muted)",margin:"6px 0 0 21px"}}>
          {log.effect==="good"?"○ 効いた — じぶんの武器が1つ増えたね":log.effect==="soso"?"△ まあまあ — それでも試せたのがえらい":"× 合わなかった — あなたのせいじゃないよ。別のを試そう"}
          <span style={{color:"var(--text-muted)",opacity:0.75}}>（もう一度おすと、えらび直せるよ）</span>
        </p>
      )}
    </div>
  );
}

function AvatarHero(){
  const{state,dispatch}=useDiaryCtx();
  const todayStr=today();
  const todayEntries=state.entries.filter(e=>e.date===todayStr);
  const todayAvg=averageScore(todayEntries);
  const latest=todayEntries.length?[...todayEntries].sort((a,b)=>String(a.createdAt||"").localeCompare(String(b.createdAt||"")))[todayEntries.length-1]:null;

  const guide=state.stateGuide||cloneDefaultGuide();
  const row=latest?(guide[String(latest.score)]||DEFAULT_STATE_GUIDE[String(latest.score)]):null;
  const seen=[];todayEntries.forEach(e=>(e.visitors||[]).forEach(id=>{if(!seen.includes(id))seen.push(id);}));
  const[squish,setSquish]=useState(0);
  const[notes,setNotes]=useState([]);
  const[said,setSaid]=useState(null);
  const[editName,setEditName]=useState(false);
  const[nameDraft,setNameDraft]=useState("");
  const name=(state.avatar&&state.avatar.name)||"じぶん";
  const kind=(state.avatar&&state.avatar.kind)||"a";
  const isShindoi=mood==="shindoi";
  const tap=()=>{
    setSquish(Date.now());
    const id=Date.now()+Math.random();
    // しんどい帯では♪を出さない（静かな反応のみ）— SV裁定
    setNotes(n=>[...n,{id,ch:isShindoi?"…":"♪"}]);
    setTimeout(()=>setNotes(n=>n.filter(x=>x.id!==id)),1300);
    // まれに一言（毎タップでは喋らない・しんどい帯は「ゆっくりでいいよ」のみ）
    if(!said&&Math.random()<0.22){
      const lines=isShindoi?["ゆっくりでいいよ"]:["きょうも、ここにいるよ","記録してもしなくても、ここにいるよ","ゆっくりでいいよ"];

// ── Report helpers ──
const RANGE_OPTIONS = [
  { key:"1w", label:"1週間",  days:7 },
  { key:"2w", label:"2週間",  days:14 },
  { key:"1m", label:"1ヶ月",  days:30 },
  { key:"2m", label:"2ヶ月",  days:60 },
  { key:"3m", label:"3ヶ月",  days:90 },
];

function getDateRange(endDate, days) {
  const dates = [];
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(endDate);
    d.setDate(d.getDate() - i);
    dates.push(toDateString(d));
  }
  return dates;
}

function getPrevRange(endDate, days) {
  const d = new Date(endDate);
  d.setDate(d.getDate() - days);
  return getDateRange(d, days);
}

function buildChartData(dates, entries, rangeKey) {
  // Group dates intelligently based on range
  if (rangeKey === "1w") {
    // Daily
    return dates.map(date => {
      const de = entries.filter(e => e.date === date);
      const d = new Date(date);
      const r = { date, label: `${d.getMonth()+1}/${d.getDate()}`, avg: averageScore(de) };
      for (const s of TIME_SLOTS) { const entry = de.find(e => e.timeSlot === s); r[s] = entry ? entry.score : null; }
      return r;
    });
  } else if (rangeKey === "2w") {
    // Daily
    return dates.map(date => {
      const de = entries.filter(e => e.date === date);
      const d = new Date(date);
      const r = { date, label: `${d.getMonth()+1}/${d.getDate()}`, avg: averageScore(de) };
      for (const s of TIME_SLOTS) { const entry = de.find(e => e.timeSlot === s); r[s] = entry ? entry.score : null; }
      return r;
    });
  } else {
    // Group by week for 1m/2m/3m
    const weeks = [];
    let chunk = [];
    dates.forEach((date, i) => {
      chunk.push(date);
      const d = new Date(date);
      if (d.getDay() === 0 || i === dates.length - 1) {
        const wEntries = entries.filter(e => chunk.includes(e.date));
        const startD = new Date(chunk[0]);
        const r = { date: chunk[0], label: `${startD.getMonth()+1}/${startD.getDate()}~`, avg: averageScore(wEntries) };
        for (const s of TIME_SLOTS) {
          const slotE = wEntries.filter(e => e.timeSlot === s);
          r[s] = averageScore(slotE);
        }
        weeks.push(r);
        chunk = [];
      }
    });
    return weeks;
  }
}

function generateRangeInsights(entries, prevEntries, days, rangeLabel) {
  const ins = [];
  if (!entries.length) { ins.push("まだ書いてないよ。少しずつ始めよう！"); return ins; }
  const totalSlots = Math.round(days * 4);
  const rate = Math.round((entries.length / totalSlots) * 100);
  ins.push(`${totalSlots}回のうち ${entries.length}回 書いたよ（${rate}%）`);
  const avg = averageScore(entries);
  if (avg !== null) ins.push(`${rangeLabel}の平均: ${avg >= 0 ? "+" : ""}${avg.toFixed(1)}`);
  const pAvg = averageScore(prevEntries);
  if (avg !== null && pAvg !== null) {
    const diff = avg - pAvg;
    if (Math.abs(diff) >= 0.3) ins.push(`前と比べて ${diff > 0 ? "+" : ""}${diff.toFixed(1)} ${diff > 0 ? "上がった！" : "下がった"}`);
    else ins.push("前と同じくらいだよ");
  }
  const bs = averageByTimeSlot(entries);
  let ws = null, wa = Infinity, bsSlot = null, ba = -Infinity;
  for (const s of TIME_SLOTS) {
    if (bs[s].avg !== null && bs[s].avg < wa) { wa = bs[s].avg; ws = s; }
    if (bs[s].avg !== null && bs[s].avg > ba) { ba = bs[s].avg; bsSlot = s; }
  }
  if (bsSlot && ws && bsSlot !== ws) {
    ins.push(`${TIME_SLOT_CONFIG[bsSlot].label}が一番良い（${ba >= 0 ? "+" : ""}${ba.toFixed(1)}）、${TIME_SLOT_CONFIG[ws].label}は少し低いね（${wa >= 0 ? "+" : ""}${wa.toFixed(1)}）`);
  } else if (ws) {
    ins.push(`${TIME_SLOT_CONFIG[ws].label}のきもちが低いみたい → 過ごし方を変えてみよう`);
  }
  // Score trend (first half vs second half)
  if (entries.length >= 8) {
    const mid = Math.floor(entries.length / 2);
    const sorted = [...entries].sort((a,b) => a.date.localeCompare(b.date));
    const firstHalf = averageScore(sorted.slice(0, mid));
    const secondHalf = averageScore(sorted.slice(mid));
    if (firstHalf !== null && secondHalf !== null) {
      const trend = secondHalf - firstHalf;
      if (trend > 0.5) ins.push(`だんだん良くなってきてるよ ↗ (+${trend.toFixed(1)})`);
      else if (trend < -0.5) ins.push(`少し下がってきてるかも ↘ (${trend.toFixed(1)})`);
      else ins.push("ずっと落ち着いてるね");
    }
  }
  return ins;
}

        <button onClick={()=>setOffset(offset-1)} style={{...S.btn,width:36,height:36,borderRadius:18,background:"var(--card)",color:"var(--text-sub)",fontSize:14,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"var(--shadow-sm)",border:"1px solid var(--border)"}}>←</button>
        <div style={{textAlign:"center"}}>
          <p style={{fontSize:14,fontWeight:600,margin:0}}>{rangeStr}</p>
          {isLatest&&<p style={{fontSize:10,fontWeight:600,color:"var(--accent)",margin:0}}>今</p>}
        </div>
        <button onClick={()=>setOffset(Math.min(0,offset+1))} disabled={isLatest}
          style={{...S.btn,width:36,height:36,borderRadius:18,background:"var(--card)",color:isLatest?"var(--text-muted)":"var(--text-sub)",fontSize:14,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"var(--shadow-sm)",border:"1px solid var(--border)",opacity:isLatest?0.4:1}}>→</button>
      </div>

      {/* Summary */}
      <div style={{...S.card,textAlign:"center",padding:24,background:"linear-gradient(135deg, #FDF3E3 0%, #FBE8D3 55%, #F7DFC5 100%)",border:"none"}}>
        <p style={{fontSize:11,fontWeight:600,color:"var(--accent)",letterSpacing:"0.06em",marginBottom:6}}>{rangeOpt.label}の平均</p>
        {avg!==null?<span style={{fontSize:40,fontWeight:800,color:getScoreColor(avg)}}>{avg>=0?"+":""}{avg.toFixed(1)}</span>
          :<span style={{fontSize:32,color:"var(--text-muted)",fontWeight:300}}>---</span>}
        {avg!==null&&pAvg!==null&&(
          <p style={{fontSize:12,color:"var(--text-sub)",marginTop:6}}>前と比べて <span style={{fontWeight:700,color:avg-pAvg>0?"var(--positive)":avg-pAvg<0?"var(--negative)":"var(--text-muted)"}}>{avg-pAvg>0?"↑":avg-pAvg<0?"↓":"→"}{Math.abs(avg-pAvg).toFixed(1)}</span></p>
        )}
        <p style={{fontSize:11,color:"var(--text-muted)",marginTop:8}}>{totalSlots}回のうち {entries.length}回 書いた</p>
      </div>

      {/* Insights */}
      <div style={S.card}>
        <h3 style={{fontSize:12,fontWeight:600,color:"var(--text-sub)",marginBottom:10}}>気づいたこと</h3>
        {insights.map((ins,i)=><div key={i} style={{display:"flex",gap:8,marginBottom:8,alignItems:"flex-start"}}><div style={{width:6,height:6,borderRadius:3,background:"var(--accent)",marginTop:5,flexShrink:0}}/><span style={{fontSize:13,color:"var(--text)",lineHeight:1.5}}>{ins}</span></div>)}
      </div>

      {/* Trend */}
      <div style={S.card}>
        <h3 style={{fontSize:12,fontWeight:600,color:"var(--text-sub)",marginBottom:12}}>
          {rangeKey==="1w"||rangeKey==="2w"?"毎日の流れ":"週ごとの流れ"}
        </h3>
        <ResponsiveContainer width="100%" height={200}>
          <LineChart data={chartData} margin={{top:5,right:5,bottom:0,left:-25}}>
            <XAxis dataKey="label" axisLine={false} tickLine={false} tick={{fontSize:9,fill:"var(--text-muted)"}} interval={rangeKey==="2w"?1:rangeKey==="1w"?0:"preserveStartEnd"}/>
            <YAxis domain={[-5,5]} axisLine={false} tickLine={false} tick={{fontSize:9,fill:"var(--text-muted)"}} ticks={[-5,0,5]}/>
            <ReferenceLine y={0} stroke="var(--border)" strokeDasharray="3 3"/>
            <Tooltip contentStyle={{background:"white",border:"1px solid var(--border)",borderRadius:10,fontSize:12,boxShadow:"var(--shadow-md)"}}/>
            {Object.entries(SLOT_COLORS_CHART).map(([k,c])=><Line key={k} type="monotone" dataKey={k} stroke={c} strokeWidth={1.5} strokeOpacity={0.35} dot={false} connectNulls/>)}
            <Line type="monotone" dataKey="avg" stroke="var(--accent)" strokeWidth={3} dot={{r:3,fill:"var(--accent)",strokeWidth:2,stroke:"white"}} connectNulls/>
          </LineChart>
        </ResponsiveContainer>
        <div style={{display:"flex",flexWrap:"wrap",gap:12,marginTop:8,justifyContent:"center"}}>
          {[{c:"var(--accent)",l:"平均",bold:true},...Object.entries(SLOT_COLORS_CHART).map(([k,c])=>({c,l:TIME_SLOT_CONFIG[k].label}))].map(x=>
            <div key={x.l} style={{display:"flex",alignItems:"center",gap:4}}>
              <span style={{width:10,height:x.bold?3:2,borderRadius:1,background:x.c,display:"inline-block"}}/>
              <span style={{fontSize:10,color:"var(--text-muted)"}}>{x.l}</span>
            </div>
          )}
        </div>
      </div>

      {/* Best/Worst */}
      {(best||worst)&&(
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
          {[{label:"一番良かった時",entry:best,bg:"linear-gradient(135deg,#E5F2E0,#CBE5C4)"},{label:"一番辛かった時",entry:worst,bg:"linear-gradient(135deg,#F9E0D8,#F2C4B4)"}].map(({label,entry,bg})=>(
            <div key={label} style={{...S.card,padding:16,background:bg,border:"none"}}>
              <p style={{fontSize:10,fontWeight:600,color:"var(--text-sub)",marginBottom:6}}>{label}</p>
              {entry?(
                <>
                  <div style={{display:"flex",alignItems:"center",gap:6}}>
                    <span style={{fontSize:22,fontWeight:800,color:getScoreColor(entry.score)}}>{entry.score>0?`+${entry.score}`:entry.score}</span>
                    <FaceIcon score={entry.score} size={24}/>
                  </div>
                  <p style={{fontSize:10,color:"var(--text-sub)",marginTop:6}}>{formatDateJP(entry.date)} {TIME_SLOT_CONFIG[entry.timeSlot].label}</p>
                  {entry.comment&&<p style={{fontSize:10,color:"var(--text-sub)",marginTop:2,overflow:"hidden",textOverflow:"ellipsis",display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical"}}>{entry.comment}</p>}
                </>
              ):<p style={{fontSize:11,color:"var(--text-muted)"}}>---</p>}
            </div>
          ))}
        </div>
      )}

      {/* Time slot comparison */}
      <div style={S.card}>
        <h3 style={{fontSize:12,fontWeight:600,color:"var(--text-sub)",marginBottom:12}}>時間帯別</h3>
        <ResponsiveContainer width="100%" height={140}>
          <BarChart data={slotChartData} margin={{top:5,right:5,bottom:0,left:-25}}>
            <XAxis dataKey="name" axisLine={false} tickLine={false} tick={{fontSize:11,fill:"var(--text-muted)"}}/>
            <YAxis domain={[-5,5]} axisLine={false} tickLine={false} tick={{fontSize:9,fill:"var(--text-muted)"}} ticks={[-5,0,5]}/>
            <ReferenceLine y={0} stroke="var(--border)" strokeDasharray="3 3"/>
            <Bar dataKey="avg" radius={[6,6,0,0]}>{slotChartData.map((e,i)=><Cell key={i} fill={e.hasData?getScoreColor(e.avg):"#E8E6E3"} opacity={e.hasData?0.8:0.4}/>)}</Bar>
          </BarChart>
        </ResponsiveContainer>
      </div>

      {/* Comments */}
      <div style={S.card}>
        <h3 style={{fontSize:12,fontWeight:600,color:"var(--text-sub)",marginBottom:12}}>書いたメモ ({comments.length})</h3>
        {comments.length===0?<p style={{fontSize:12,color:"var(--text-muted)",textAlign:"center"}}>この期間に書いたメモはないよ</p>
          :comments.slice(0,20).map(e=>(
            <div key={e.id} style={{display:"flex",gap:10,marginBottom:12}}>
              <div style={{width:3,borderRadius:2,flexShrink:0,background:getScoreColor(e.score)}}/>
              <div><p style={{fontSize:10,color:"var(--text-muted)",margin:0}}>{formatDateJP(e.date)} {TIME_SLOT_CONFIG[e.timeSlot].label}</p><p style={{fontSize:13,color:"var(--text)",margin:"2px 0 0",lineHeight:1.5}}>{e.comment}</p></div>
            </div>
          ))}
        {comments.length>20&&<p style={{fontSize:11,color:"var(--text-muted)",textAlign:"center"}}>ほかに あと {comments.length-20}件</p>}
      </div>

      {/* やったセルフケア */}
      <CareLogSummary rangeDates={rangeDates}/>

      {/* Reflection */}
      <div style={S.card}>
        <h3 style={{fontSize:12,fontWeight:600,color:"var(--text-sub)",marginBottom:8}}>ふりかえり</h3>
        <textarea value={weekNote} onChange={e=>dispatch({type:"SET_WEEKLY_NOTE",weekKey,note:e.target.value})}
          placeholder="この期間のこと、思ったことを書いてみよう..." rows={3} style={{...S.input,resize:"none"}}
          onFocus={e=>e.target.style.borderColor="var(--accent-light)"} onBlur={e=>e.target.style.borderColor="var(--border)"}/>
      </div>
    </div>
  );
}

// Settings Tab
function SettingsTab(){
  const{state,dispatch}=useDiaryCtx();
  const fileRef=useRef(null);
  const[importMsg,setImportMsg]=useState(null);
  const[showClear,setShowClear]=useState(false);
  const[aiCopied,setAiCopied]=useState(false);
  const[showCrisisModal,setShowCrisisModal]=useState(false);
  const handleExport=()=>{const json=exportAllData();const blob=new Blob([json],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=`metacog_backup_${today()}.json`;a.click();URL.revokeObjectURL(url);};
  const handleImport=(e)=>{const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=(ev)=>{const r=importData(ev.target.result);setImportMsg(r.message);if(r.success)window.location.reload();};reader.readAsText(file);e.target.value="";};
  const handleAICopy=()=>{const text=formatForAI(state.entries,state.stateGuide);navigator.clipboard.writeText(text).then(()=>{setAiCopied(true);setTimeout(()=>setAiCopied(false),2500);}).catch(()=>{const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);setAiCopied(true);setTimeout(()=>setAiCopied(false),2500);});};
  const btnStyle={...S.btn,width:"100%",padding:"12px 0",borderRadius:"var(--radius-sm)",background:"#F1F0EE",color:"var(--text)",fontSize:14,fontWeight:500,marginBottom:8};

  return(
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      <div style={S.card}>
        <label style={{fontSize:12,fontWeight:600,color:"var(--text-sub)",display:"block",marginBottom:8}}>名前</label>
        <input type="text" value={state.settings.userName} onChange={e=>dispatch({type:"UPDATE_SETTINGS",settings:{userName:e.target.value}})} placeholder="あなたの名前..." style={S.input}
          onFocus={e=>e.target.style.borderColor="var(--accent-light)"} onBlur={e=>e.target.style.borderColor="var(--border)"}/>
      </div>
      <div style={S.card}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div><p style={{fontSize:14,fontWeight:500,color:"var(--text)",margin:0}}>お知らせ</p><p style={{fontSize:11,color:"var(--text-muted)",margin:"2px 0 0"}}>もうすぐ使えるよ</p></div>
          <div onClick={()=>dispatch({type:"UPDATE_SETTINGS",settings:{notificationsEnabled:!state.settings.notificationsEnabled}})}
            className="toggle-track" style={{background:state.settings.notificationsEnabled?"var(--accent)":"#D1D1D6"}}>
            <span className="toggle-thumb" style={{transform:state.settings.notificationsEnabled?"translateX(18px)":"translateX(4px)"}}/>
          </div>
        </div>
      </div>
      <div style={{...S.card,background:"linear-gradient(135deg, #FDF3E3 0%, #FBE8D3 55%, #F7DFC5 100%)",border:"none"}}>
        <h3 style={{fontSize:12,fontWeight:600,color:"var(--accent)",marginBottom:6}}>✦ AI分析</h3>
        <p style={{fontSize:11,color:"var(--text-sub)",lineHeight:1.6,margin:"0 0 12px"}}>
          記録と状態表をまとめてコピーして、ChatGPTやClaudeに貼り付けると
          グラフ・傾向分析・セルフケア提案などをしてもらえるよ
        </p>
        <button onClick={handleAICopy}
          style={{...btnStyle,marginBottom:0,
            background:aiCopied?"var(--positive)":"var(--accent)",
            color:"white",fontWeight:600,
            boxShadow:aiCopied?"none":"0 4px 12px rgba(192,95,56,0.3)"}}>
          {aiCopied?"✓ コピーした！AIに貼り付けよう":"📋 AI分析用にコピーする"}
        </button>
        {state.entries.length===0&&<p style={{fontSize:10,color:"var(--text-muted)",textAlign:"center",marginTop:6}}>※ まだ記録がないよ。記録してからコピーしてね</p>}
      </div>
      {/* 相談先（危機カード） */}
      <div style={{...S.card,background:"linear-gradient(135deg, #FDF0EE, #FBE9E5)",border:"none"}}>
        <h3 style={{fontSize:12,fontWeight:700,color:"#992d20",marginBottom:6}}>🆘 すごくつらいときの連絡先</h3>
        <p style={{fontSize:11,color:"var(--text-sub)",lineHeight:1.6,margin:"0 0 10px"}}>
          支援者と一緒に書いておくと、つらい日にすぐ見られるよ。書いた内容はこのスマホの中だけに保存されます。
        </p>
        <button onClick={()=>setShowCrisisModal(true)} style={{...S.btn,width:"100%",padding:"11px 0",borderRadius:"var(--radius-sm)",background:"white",color:"#992d20",fontSize:13,fontWeight:600,border:"1px solid rgba(192,57,43,0.25)"}}>
          連絡先を確認・編集する
        </button>
      </div>
      <div style={S.card}>
        <h3 style={{fontSize:12,fontWeight:600,color:"var(--text-sub)",marginBottom:12}}>データ</h3>
        <button onClick={handleExport} style={btnStyle}>データを保存する (JSON)</button>
        <button onClick={()=>fileRef.current?.click()} style={btnStyle}>データを読み込む</button>
        <input ref={fileRef} type="file" accept=".json" onChange={handleImport} style={{display:"none"}}/>
        {importMsg&&<p style={{fontSize:12,color:"var(--positive)",textAlign:"center",marginBottom:8}}>{importMsg}</p>}
        {!showClear?(
          <button onClick={()=>setShowClear(true)} style={{...btnStyle,background:"transparent",color:"var(--negative)",border:"1px solid rgba(225,112,85,0.2)"}}>全部消す</button>
        ):(
          <div style={{border:"1px solid rgba(225,112,85,0.3)",borderRadius:"var(--radius-sm)",padding:16}}>
            <p style={{fontSize:12,color:"var(--negative)",textAlign:"center",marginBottom:12}}>もう戻せないよ。本当に消す？</p>
            <div style={{display:"flex",gap:8}}>
              <button onClick={()=>setShowClear(false)} style={{...S.btn,flex:1,padding:"10px 0",borderRadius:8,background:"#F1F0EE",color:"var(--text-sub)",fontSize:13,fontWeight:500}}>やめる</button>
              <button onClick={()=>{clearAllData();window.location.reload();}} style={{...S.btn,flex:1,padding:"10px 0",borderRadius:8,background:"var(--negative)",color:"white",fontSize:13,fontWeight:600}}>消す</button>
            </div>
          </div>
        )}
      </div>
      <PrivacyBanner/>
      <p style={{fontSize:10,color:"var(--text-muted)",textAlign:"center",padding:"16px 0",fontWeight:500}}>きもち日記 v0.5.0</p>
      {showCrisisModal&&<CrisisModal onClose={()=>setShowCrisisModal(false)}/>}
    </div>
  );
}

// こんな時は？（状況ナビ）— PDFの感情ナビのアプリ版
// ═══════════════════════════════════════
function SituationNav(){
  const{state,dispatch}=useDiaryCtx();
  const[selSit,setSelSit]=useState(()=>state.pendingSit||null);
  const[sceneFilter,setSceneFilter]=useState("all");
  const[addText,setAddText]=useState("");
  const[addedMsg,setAddedMsg]=useState(null);
  // ずかんの「この子が来たときの手当てをみる」から飛んできた場合、該当状況をひらく
  useEffect(()=>{if(state.pendingSit){setSelSit(state.pendingSit);dispatch({type:"CLEAR_PENDING_SIT"});}},[state.pendingSit]);

  const sit = SITUATIONS.find(s=>s.id===selSit);
  const items = useMemo(()=>{
    if(!selSit) return [];
    let r = CARE_ITEMS.filter(it=>it.sit.includes(selSit));
    if(sceneFilter!=="all") r = r.filter(it=>it.scene===sceneFilter||it.scene==="any");
    // 効いた実績が高い順
    return r.sort((a,b)=>effectScore(b.id,state.careLog)-effectScore(a.id,state.careLog));
  },[selSit,sceneFilter,state.careLog]);

  const quickAdd=()=>{
    const t=addText.trim();
    if(!t) return;
    dispatch({type:"ADD_MY_CARE",item:{id:crypto.randomUUID(),text:t,cat:"my",scene:"any",createdAt:new Date().toISOString()}});
    setAddText("");
    setAddedMsg("追加したよ！記録した時の提案にも出てくるよ");
    setTimeout(()=>setAddedMsg(null),2500);
  };

  if(!selSit){
    // 状況グリッド
    const cats=["now","feel","think","base","fit","joy"];
    return(
      <div style={{display:"flex",flexDirection:"column",gap:14}}>
        <div style={{...S.card,padding:18,background:"linear-gradient(135deg, #FDF3E3 0%, #F9E6CE 100%)",border:"none"}}>
          <p style={{fontSize:11,fontWeight:700,color:"var(--accent)",letterSpacing:"0.05em",margin:0}}>こんな時は？</p>
          <h2 style={{fontSize:17,fontWeight:700,margin:"4px 0 6px"}}>今の状態に近いものをタップ</h2>
          <p style={{fontSize:12,color:"var(--text-sub)",lineHeight:1.6,margin:0}}>
            しんどい時ほど、探すのは大変。近いものを1つ選べば、合った手当てが出てくるよ。全部やらなくていい、1つで十分。
          </p>
        </div>
        {cats.map(catKey=>{
          const cat=CARE_CATEGORIES[catKey];
          const sits=SITUATIONS.filter(s=>s.cat===catKey);
          if(!sits.length) return null;
          return(
            <div key={catKey}>
              <p style={{fontSize:11,fontWeight:700,color:cat.color,margin:"0 0 6px",letterSpacing:"0.03em"}}>{cat.icon} {cat.sub}</p>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                {sits.map(s=>(
                  <button key={s.id} onClick={()=>{setSelSit(s.id);setSceneFilter("all");}}
                    style={{...S.btn,display:"flex",alignItems:"center",gap:8,padding:"12px 12px",borderRadius:12,textAlign:"left",
                      background:"var(--card)",border:`1px solid ${cat.color}22`,boxShadow:"var(--shadow-sm)"}}>
                    <span style={{fontSize:17,flexShrink:0}}>{s.icon}</span>
                    <span style={{fontSize:13,fontWeight:600,color:"var(--text)",lineHeight:1.45}}>{s.label}</span>
                  </button>
                ))}
              </div>
            </div>
          );
        })}
        {/* じぶんのケアを追加 */}
        <div style={S.card}>
          <p style={{fontSize:12,fontWeight:700,color:"var(--text)",margin:"0 0 4px"}}>⭐ じぶんのセルフケアを追加</p>
          <p style={{fontSize:11,color:"var(--text-muted)",margin:"0 0 8px"}}>ここにない「わたしに効くこと」を足しておこう</p>
          <div style={{display:"flex",gap:8}}>
            <input type="text" value={addText} onChange={e=>setAddText(e.target.value)} placeholder="例：推しの曲を1曲きく"
              style={{...S.input,fontSize:13}} onKeyDown={e=>{if(e.key==="Enter")quickAdd();}}/>
            <button onClick={quickAdd} style={{...S.btn,flexShrink:0,padding:"0 16px",borderRadius:"var(--radius-sm)",background:"var(--accent)",color:"white",fontSize:13,fontWeight:600}}>追加</button>
          </div>
          {addedMsg&&<p className="fade-up" style={{fontSize:11,color:"var(--positive)",margin:"6px 0 0"}}>✓ {addedMsg}</p>}
          {state.myCare.length>0&&(
            <div style={{marginTop:10}}>
              {state.myCare.map(m=>(
                <div key={m.id} style={{display:"flex",gap:8,alignItems:"center",padding:"6px 0",borderTop:"1px solid var(--border)"}}>
                  <span style={{fontSize:12}}>⭐</span>
                  <span style={{flex:1,fontSize:12.5,color:"var(--text)"}}>{m.text}</span>
                  <button onClick={()=>dispatch({type:"DELETE_MY_CARE",id:m.id})} style={{...S.btn,fontSize:11,color:"var(--text-muted)",background:"transparent",padding:"2px 6px"}}>削除</button>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    );
  }

  // 状況の詳細（項目リスト）
  const cat=CARE_CATEGORIES[sit.cat];
  return(
    <div style={{display:"flex",flexDirection:"column",gap:12}}>
      <button onClick={()=>setSelSit(null)} style={{...S.btn,alignSelf:"flex-start",fontSize:12,color:"var(--text-sub)",background:"var(--card)",padding:"8px 14px",borderRadius:18,boxShadow:"var(--shadow-sm)",border:"1px solid var(--border)"}}>← もどる</button>
      <div style={{...S.card,padding:16,background:cat.bg,border:"none"}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontSize:22}}>{sit.icon}</span>
          <div>
            <h2 style={{fontSize:16,fontWeight:700,margin:0}}>{sit.label}</h2>
            <p style={{fontSize:11,color:cat.color,fontWeight:600,margin:"2px 0 0"}}>{cat.icon} {cat.sub}</p>
          </div>
        </div>
      </div>
      {/* 場面フィルタ */}
      <div style={{display:"flex",gap:6}}>
        {[["all","すべて"],["work","🏢 職場で"],["home","🏠 家で"]].map(([k,l])=>(
          <button key={k} onClick={()=>setSceneFilter(k)}
            style={{...S.btn,padding:"6px 14px",borderRadius:16,fontSize:12,fontWeight:600,
              background:sceneFilter===k?cat.color:"var(--card)",color:sceneFilter===k?"white":"var(--text-sub)",
              border:sceneFilter===k?"none":"1px solid var(--border)"}}>{l}</button>
        ))}
      </div>
      <div style={{...S.card,padding:"6px 16px 10px"}}>
        {items.length===0 && <p style={{fontSize:12,color:"var(--text-muted)",textAlign:"center",padding:"14px 0"}}>この場面の項目はまだないよ。「すべて」も見てみてね</p>}
        {items.map(it=>(
          <div key={it.id}>
            <CareItemRow item={it} careLog={state.careLog} dispatch={dispatch} score={null}/>
            <AddToGuideRow item={it}/>
          </div>
        ))}
      </div>
      <p style={{fontSize:10.5,color:"var(--text-muted)",textAlign:"center",lineHeight:1.6}}>合わないと感じたら、やめて大丈夫。<br/>効かなかったのは、あなたのせいではありません。</p>
    </div>
  );
}

// 「じぶんの状態表に入れる」行
function AddToGuideRow({item}){
  const{state,dispatch}=useDiaryCtx();
  const[open,setOpen]=useState(false);
  const[done,setDone]=useState(false);
  const addTo=(key)=>{
    const row=state.stateGuide[key]||DEFAULT_STATE_GUIDE[key];
    if(!row.selfCare.includes(item.text)){
      dispatch({type:"UPDATE_STATE_GUIDE",key,patch:{selfCare:[...row.selfCare,item.text]}});
    }
    setDone(true); setOpen(false);
    setTimeout(()=>setDone(false),2000);
  };
  if(done) return <p className="fade-up" style={{fontSize:10.5,color:"var(--positive)",margin:"2px 0 8px 21px"}}>✓ じぶんの状態表に入れたよ</p>;
  return(
    <div style={{margin:"2px 0 8px 21px"}}>
      {!open ? (
        <button onClick={()=>setOpen(true)} style={{...S.btn,fontSize:10.5,color:"var(--accent)",background:"transparent",padding:"2px 0"}}>＋ じぶんの状態表に入れる</button>
      ):(
        <div className="fade-up" style={{display:"flex",gap:4,alignItems:"center",flexWrap:"wrap"}}>
          <span style={{fontSize:10.5,color:"var(--text-sub)"}}>どの状態のとき？</span>
          {STATE_KEYS.map(k=>{
            const sc=parseInt(k,10);
            return <button key={k} onClick={()=>addTo(k)} style={{...S.btn,fontSize:10.5,fontWeight:700,padding:"3px 7px",borderRadius:10,background:"var(--card)",border:"1px solid var(--border)",color:getScoreColor(sc)}}>{sc>0?`+${sc}`:sc}</button>;
          })}
          <button onClick={()=>setOpen(false)} style={{...S.btn,fontSize:10.5,color:"var(--text-muted)",background:"transparent",padding:"3px 5px"}}>やめる</button>
        </div>
      )}
    </div>
  );
}

// セルフケア（道具箱）タブ — こんな時は？ / じぶんの状態表 / よみもの
function SelfCareTab(){
  const{state,dispatch}=useDiaryCtx();
  const[view,setView]=useState("situations");
  const[expanded,setExpanded]=useState("0");
  const[showReset,setShowReset]=useState(false);
  const guide = state.stateGuide || cloneDefaultGuide();

  const update=(key,patch)=>dispatch({type:"UPDATE_STATE_GUIDE",key,patch});
  const updateSelfCareText=(key,text)=>{
    const lines = text.split("\n").map(s=>s.trim()).filter(s=>s.length>0);
    update(key,{selfCare:lines});
  };

  const segments=[["situations","🧭 こんな時は？"],["guide","📊 じぶんの状態表"],["columns","📖 よみもの"]];

  return(
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      {/* セグメント切替 */}
      <div style={{display:"flex",gap:6,background:"var(--card)",borderRadius:14,padding:4,boxShadow:"var(--shadow-sm)",border:"1px solid var(--border)"}}>
        {segments.map(([k,l])=>(
          <button key={k} onClick={()=>setView(k)}
            style={{...S.btn,flex:1,padding:"9px 0",borderRadius:10,fontSize:11.5,fontWeight:600,
              background:view===k?"var(--accent)":"transparent",color:view===k?"white":"var(--text-sub)"}}>{l}</button>
        ))}
      </div>

      {view==="situations" && <SituationNav/>}
      {view==="columns" && <ColumnsView/>}
      {view==="guide" && (<>
      {/* 説明カード */}
      <div style={{...S.card,padding:18,background:"linear-gradient(135deg, #FDF3E3 0%, #F9E6CE 100%)",border:"none"}}>
        <p style={{fontSize:11,fontWeight:700,color:"var(--accent)",letterSpacing:"0.05em",margin:0}}>じぶんの状態表</p>
        <h2 style={{fontSize:17,fontWeight:700,margin:"4px 0 6px"}}>状態とセルフケアを書こう</h2>
        <p style={{fontSize:12,color:"var(--text-sub)",lineHeight:1.6,margin:0}}>
          -5〜+5 のそれぞれに「どんな様子か」「何をすると楽になるか」を書いておくと、
          きもちを記録した時に自分専用のセルフケアが出てくるよ。
          「🧭 こんな時は？」から気に入ったものを入れることもできるよ。
        </p>
      </div>

      {/* リセットボタン */}
      <div style={{display:"flex",justifyContent:"flex-end"}}>
        {!showReset?(
          <button onClick={()=>setShowReset(true)} style={{...S.btn,fontSize:11,color:"var(--text-muted)",background:"transparent",padding:"6px 10px",borderRadius:8,border:"1px solid var(--border)"}}>
            ↺ デフォルトに戻す
          </button>
        ):(
          <div style={{display:"flex",gap:6,alignItems:"center"}}>
            <span style={{fontSize:11,color:"var(--text-sub)"}}>自分の編集が消えるよ</span>
            <button onClick={()=>setShowReset(false)} style={{...S.btn,fontSize:11,padding:"6px 10px",borderRadius:8,background:"#F1F0EE",color:"var(--text-sub)"}}>やめる</button>
            <button onClick={()=>{dispatch({type:"RESET_STATE_GUIDE"});setShowReset(false);}} style={{...S.btn,fontSize:11,padding:"6px 10px",borderRadius:8,background:"var(--negative)",color:"white",fontWeight:600}}>戻す</button>
          </div>
        )}
      </div>

      {/* 11行のカード */}
      {STATE_KEYS.map(key=>{
        const score = parseInt(key,10);
        const row = guide[key] || DEFAULT_STATE_GUIDE[key];
        const color = getScoreColor(score);
        const rgb = (color.match(/\d+/g)||["108","92","231"]).slice(0,3).join(",");
        const isOpen = expanded===key;
        const selfCareText = (row.selfCare||[]).join("\n");
        return(
          <div key={key} style={{
            background:"var(--card)",
            borderRadius:"var(--radius)",
            border:`1px solid rgba(${rgb},${isOpen?0.4:0.18})`,
            boxShadow:isOpen?"var(--shadow-md)":"var(--shadow-sm)",
            overflow:"hidden",
            transition:"all 0.2s"
          }}>
            <button onClick={()=>setExpanded(isOpen?null:key)} style={{
              ...S.btn, width:"100%", display:"flex", alignItems:"center", gap:12,
              padding:"14px 16px", background:`linear-gradient(90deg, rgba(${rgb},0.10), rgba(${rgb},0.02))`,
              textAlign:"left"
            }}>
              <div style={{
                width:42,height:42,borderRadius:12,
                background:`rgba(${rgb},0.18)`,
                display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0
              }}>
                <span style={{fontSize:16,fontWeight:800,color}}>{score>0?`+${score}`:score}</span>
              </div>
              <div style={{flex:1,minWidth:0}}>
                <p style={{fontSize:14,fontWeight:700,color:"var(--text)",margin:0,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{row.title || "（タイトル未設定）"}</p>
                <p style={{fontSize:11,color:"var(--text-muted)",margin:"2px 0 0",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>セルフケア {(row.selfCare||[]).length}件</p>
              </div>
              <FaceIcon score={score} size={26}/>
              <span style={{fontSize:14,color:"var(--text-muted)",marginLeft:4,transition:"transform 0.2s",transform:isOpen?"rotate(90deg)":"none"}}>›</span>
            </button>

            {isOpen && (
              <div style={{padding:"12px 16px 18px",borderTop:`1px dashed rgba(${rgb},0.25)`}}>
                <label style={{fontSize:11,fontWeight:600,color:"var(--text-sub)",display:"block",marginTop:6,marginBottom:4}}>状態のタイトル</label>
                <input type="text" value={row.title} onChange={e=>update(key,{title:e.target.value})}
                  placeholder="例：とても元気" style={{...S.input,fontSize:13}}
                  onFocus={e=>e.target.style.borderColor=color} onBlur={e=>e.target.style.borderColor="var(--border)"}/>

                <label style={{fontSize:11,fontWeight:600,color:"var(--text-sub)",display:"block",marginTop:12,marginBottom:4}}>こんな様子・行動が出る</label>
                <textarea value={row.behavior} onChange={e=>update(key,{behavior:e.target.value})}
                  rows={2} placeholder="例：早口になる・予定を詰めたくなる"
                  style={{...S.input,fontSize:13,resize:"vertical",lineHeight:1.5}}
                  onFocus={e=>e.target.style.borderColor=color} onBlur={e=>e.target.style.borderColor="var(--border)"}/>

                <label style={{fontSize:11,fontWeight:600,color:"var(--text-sub)",display:"block",marginTop:12,marginBottom:4}}>
                  わたしのセルフケア <span style={{color:"var(--text-muted)",fontWeight:400}}>（1行に1つ）</span>
                </label>
                <textarea defaultValue={selfCareText} key={key+"-sc"} onBlur={e=>updateSelfCareText(key,e.target.value)}
                  rows={Math.max(3,(row.selfCare||[]).length+1)}
                  placeholder={"例：\n深呼吸をする\n白湯を飲む\n短く横になる"}
                  style={{...S.input,fontSize:13,resize:"vertical",lineHeight:1.6}}
                  onFocus={e=>e.target.style.borderColor=color}/>
                <p style={{fontSize:10,color:"var(--text-muted)",marginTop:6}}>※ ここから外れると自動で保存されるよ</p>

                {/* プレビュー */}
                <div style={{marginTop:14}}>
                  <p style={{fontSize:10,fontWeight:600,color:"var(--text-muted)",letterSpacing:"0.05em",marginBottom:4}}>↓ きもちを記録した時に出る表示</p>
                  <StateCard score={score} compact/>
                </div>
              </div>
            )}
          </div>
        );
      })}
      </>)}
    </div>
  );
}

// ═══════════════════════════════════════
// こころのキャラずかん タブ
// 無料: 名前・担当・口ぐせ・説明・確かめる質問・元の善意（臨床的に大事なものはロックしない）
// ⭐で解放: あるある＋善意の深掘り（必ずセットで表示。あるある単独表示は禁止＝SV指摘）
// ═══════════════════════════════════════
function CharZukanCard({ch, unlocked, balance, onUnlock}){
  const{dispatch}=useDiaryCtx();
  const[open,setOpen]=useState(false);
  const isInterpreter=!!ch.distortion;
  const canUnlock=balance>=UNLOCK_COST;
  return(
    <div style={{background:"var(--card)",borderRadius:"var(--radius)",border:"1px solid var(--border)",boxShadow:open?"var(--shadow-md)":"var(--shadow-sm)",overflow:"hidden",transition:"all 0.2s"}}>
      <button onClick={()=>setOpen(!open)} style={{...S.btn,width:"100%",display:"flex",alignItems:"center",gap:12,padding:"12px 14px",background:"transparent",textAlign:"left"}}>
        <CharFace id={ch.id} size={48}/>
        <div style={{flex:1,minWidth:0}}>
          <p style={{fontSize:14.5,fontWeight:800,margin:0,color:"var(--text)"}}>
            {ch.name}
            <span style={{fontSize:10,fontWeight:600,color:"var(--text-muted)",marginLeft:6}}>{isInterpreter?ch.distortion:ch.feeling}</span>
          </p>
          <p style={{fontSize:11,color:"var(--text-sub)",margin:"2px 0 0",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>「{ch.catchphrase}」</p>
        </div>
        {unlocked&&<span style={{fontSize:10,flexShrink:0}}>⭐</span>}
        <span style={{fontSize:14,color:"var(--text-muted)",transition:"transform 0.2s",transform:open?"rotate(90deg)":"none",flexShrink:0}}>›</span>
      </button>
      {open&&(
        <div className="fade-up" style={{padding:"10px 14px 14px",borderTop:"1px dashed var(--border)"}}>
          <p style={{fontSize:12.5,color:"var(--text)",lineHeight:1.7,margin:"4px 0 10px"}}>{ch.description}</p>
          {/* 訪問者→セルフケアの直リンク（感情⇔手当ての結節点） */}
          {!isInterpreter&&ch.sit&&ch.sit.length>0&&(
            <button onClick={()=>dispatch({type:"OPEN_SITUATION",sit:ch.sit[0]})}
              style={{...S.btn,width:"100%",textAlign:"left",fontSize:11.5,fontWeight:600,color:"var(--accent)",background:"rgba(192,95,56,0.07)",border:"1px solid rgba(192,95,56,0.2)",borderRadius:10,padding:"8px 12px",marginBottom:10}}>
              🩹 この子が来たときの手当てをみる ›
            </button>
          )}
          {isInterpreter&&(
            <div style={{background:"rgba(62,142,90,0.08)",border:"1px solid rgba(62,142,90,0.18)",borderRadius:10,padding:"9px 12px",marginBottom:8}}>
              <p style={{fontSize:10,fontWeight:700,color:"var(--positive)",margin:"0 0 3px",letterSpacing:"0.04em"}}>💬 落ちついて、確かめる質問</p>
              <p style={{fontSize:12.5,fontWeight:600,color:"var(--text)",margin:0,lineHeight:1.6}}>{ch.checkQ}</p>
            </div>
          )}
          {isInterpreter&&(
            <p style={{fontSize:11.5,color:"var(--text-sub)",lineHeight:1.65,margin:"0 0 10px"}}><b style={{color:"var(--text)"}}>この子の元の善意:</b> {ch.goodIntent}</p>
          )}
          {unlocked?(
            <div className="fade-up" style={{background:"rgba(232,185,79,0.10)",border:"1px solid rgba(232,185,79,0.25)",borderRadius:10,padding:"10px 12px"}}>
              <p style={{fontSize:10,fontWeight:700,color:"#B07A2E",margin:"0 0 6px",letterSpacing:"0.04em"}}>⭐ {isInterpreter?`${ch.name}の「あるある翻訳」`:`${ch.name}が来やすいとき`}</p>
              {(isInterpreter?ch.naigo:ch.aruaru).map((t,i)=>(
                <div key={i} style={{display:"flex",gap:7,alignItems:"flex-start",marginBottom:4}}>
                  <CharFace id={ch.id} size={18} style={{flexShrink:0,marginTop:1}}/>
                  <span style={{fontSize:12,color:"var(--text)",lineHeight:1.6,background:"var(--card)",borderRadius:"2px 10px 10px 10px",padding:"3px 9px",border:"1px solid var(--border)"}}>{t}</span>
                </div>
              ))}
              {isInterpreter&&<p style={{fontSize:10.5,color:"var(--text-sub)",margin:"6px 0 8px",lineHeight:1.6}}>↑ ぜんぶ、{ch.name}の「翻訳」。あなたの成績表じゃないよ。</p>}
              <p style={{fontSize:11.5,color:"var(--text)",lineHeight:1.7,margin:0,paddingTop:8,borderTop:"1px dashed rgba(176,122,46,0.3)"}}>{isInterpreter?ch.deep:ch.hint}</p>
            </div>
          ):(
            <button onClick={onUnlock} disabled={!canUnlock}
              style={{...S.btn,width:"100%",padding:"10px 0",borderRadius:10,fontSize:12.5,fontWeight:700,
                background:canUnlock?"rgba(232,185,79,0.18)":"#F1F0EE",
                color:canUnlock?"#B07A2E":"var(--text-muted)",
                border:canUnlock?"1px solid rgba(232,185,79,0.4)":"1px solid var(--border)",
                cursor:canUnlock?"pointer":"default"}}>
              {canUnlock?`⭐${UNLOCK_COST}つかって「もっと知る」をひらく`:`⭐${UNLOCK_COST}でひらけるよ（記録すると星がふえる）`}
            </button>
          )}
        </div>
      )}
    </div>
  );
}

function ZukanTab(){

  const[showCrisis,setShowCrisis]=useState(false);

  const allUnlocked=ALL_CHARS.every(c=>state.unlocks.includes(c.id));
  return(
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      {/* 導入 */}
      <div style={{...S.card,padding:18,background:"linear-gradient(135deg, #FDF3E3 0%, #F9E6CE 100%)",border:"none"}}>

        </p>
      </div>

      {/* 星のはなし */}
      <div style={{...S.card,padding:"14px 16px",display:"flex",alignItems:"center",gap:14}}>
        <div style={{textAlign:"center",flexShrink:0}}>
          <p style={{fontSize:22,fontWeight:800,color:"#B07A2E",margin:0,lineHeight:1.1}}>⭐{balance}</p>
          <p style={{fontSize:9.5,color:"var(--text-muted)",margin:"2px 0 0",fontWeight:600}}>つかえる星</p>
        </div>
        <div style={{flex:1}}>
          <p style={{fontSize:11.5,color:"var(--text-sub)",lineHeight:1.65,margin:0}}>
            星は、きもちを記録すると1つずつ増えるよ。へったり消えたりはしないよ

          </p>
        </div>
      </div>

      {allUnlocked&&(
        <div className="fade-up" style={{...S.card,padding:"14px 16px",background:"linear-gradient(135deg, #EDF5E6 0%, #DDEBD2 100%)",border:"none"}}>
          <p style={{fontSize:12.5,fontWeight:700,color:"var(--positive)",margin:0}}>🎉 ずかんをぜんぶひらいたよ！</p>
          <p style={{fontSize:11.5,color:"var(--text-sub)",margin:"4px 0 0",lineHeight:1.6}}>ここまで記録をつづけてきた、あなたの力だよ。</p>
        </div>
      )}

      {/* 訪問者 */}
      <div>
        <p style={{fontSize:11,fontWeight:700,color:"var(--text-sub)",letterSpacing:"0.05em",margin:"4px 0 8px"}}>🐾 訪問者（きもち）— 6体</p>

            <CharZukanCard key={ch.id} ch={ch} unlocked={state.unlocks.includes(ch.id)} balance={balance} onUnlock={()=>dispatch({type:"UNLOCK_CHAR",id:ch.id})}/>

        </div>
      </div>

      {/* 通訳者 */}
      <div>
        <p style={{fontSize:11,fontWeight:700,color:"var(--text-sub)",letterSpacing:"0.05em",margin:"4px 0 2px"}}>🗣 通訳者（考えのクセ）— 7匹</p>
        <p style={{fontSize:11,color:"var(--text-muted)",lineHeight:1.6,margin:"0 0 8px"}}>できごとを、ちょっと大げさに翻訳して伝えてくる子たち。翻訳に気づけたら、それだけで一歩。</p>

      {/* 合言葉（defusionの生活語・SV採用） */}

      <CrisisStrip onOpen={()=>setShowCrisis(true)}/>
      {showCrisis&&<CrisisModal onClose={()=>setShowCrisis(false)}/>}
    </div>
  );
}

// ═══════════════════════════════════════
// オンボーディング（初回ガイド）
// ═══════════════════════════════════════
const ONBOARDING_KEY = "metacog_onboarding_done";
function Onboarding({onDone}){
  const{state,dispatch}=useDiaryCtx();
  const[page,setPage]=useState(0);
  const kind=(state.avatar&&state.avatar.kind)||"a";
  const pages=[
    {
      icon: <svg width="64" height="64" viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="16" fill="#C05F38" opacity="0.15"/><text x="32" y="44" textAnchor="middle" fontSize="32" fill="#C05F38" fontFamily="sans-serif">♡</text></svg>,
      title:"きもち日記へようこそ",
      body:"毎日のきもちを記録して、自分を知るための日記アプリです。\n朝・昼・夕・夜の4つの時間帯にきもちを -5〜+5 で記録できます。"
    },
    {
      icon: <svg width="64" height="64" viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="16" fill="#3E8E5A" opacity="0.15"/><text x="32" y="44" textAnchor="middle" fontSize="32" fill="#3E8E5A" fontFamily="sans-serif">✦</text></svg>,
      title:"セルフケアを見つけよう",
      body:"きもちを記録すると、その状態に合った「今日の手当て」が出てきます。\nやってみて「効いた？」を押すと、あなた専用の武器リストが育っていくよ。\nつらい時は「セルフケア」タブの『こんな時は？』から探せます。"
    },
    {
      icon: <svg width="64" height="64" viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="16" fill="#E8B94F" opacity="0.2"/><text x="32" y="44" textAnchor="middle" fontSize="32" fontFamily="sans-serif">🐾</text></svg>,
      title:"キャラの子たちについて",
      body:"このアプリには、きもちや考え方のパターンにニックネームをつけたキャラが出てきます。\nみんな、あなたのこころの中のうごきに名前をつけた「たとえ」だよ。\nくわしくは「ずかん」タブでどうぞ。"
    },
    {
      picker:true,
      title:"あなたの分身をえらぼう",
      body:"この子が、アプリの中のあなたの分身になるよ。\nあとから何度でも変えられるよ。なまえは、ホームでつけられるよ。"
    },
    {
      icon: <svg width="64" height="64" viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="16" fill="#C05F38" opacity="0.15"/><text x="32" y="44" textAnchor="middle" fontSize="32" fill="#C05F38" fontFamily="sans-serif">🔒</text></svg>,
      title:"あなたのデータは安全です",
      body:"記録はすべて、あなたのスマホの中だけに保存されます。\nサーバーへの送信やアカウント登録は一切ありません。\n安心して使ってください。"
    }
  ];
  const p=pages[page];
  const isLast=page===pages.length-1;

  return(
    <div style={{
      position:"fixed",inset:0,zIndex:100,
      background:"var(--bg)",
      display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
      padding:24
    }}>
      <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",maxWidth:360,textAlign:"center",gap:20}}>
        {p.picker?(
          <div style={{display:"flex",gap:12,justifyContent:"center"}}>
            {AVATAR_KINDS.map(k=>(
              <button key={k} onClick={()=>dispatch({type:"UPDATE_AVATAR",avatar:{kind:k}})} aria-pressed={kind===k}
                style={{...S.btn,padding:10,borderRadius:16,background:kind===k?"rgba(192,95,56,0.10)":"transparent",
                  border:kind===k?"2px solid var(--accent-light)":"2px solid var(--border)",transition:"all 0.15s"}}>
                <AvatarFace mood="futsuu" kind={k} size={72}/>
              </button>
            ))}
          </div>
        ):p.icon}
        <h1 style={{fontSize:22,fontWeight:700,color:"var(--text)",lineHeight:1.4}}>{p.title}</h1>
        <p style={{fontSize:14,color:"var(--text-sub)",lineHeight:1.8,whiteSpace:"pre-line"}}>{p.body}</p>
      </div>

      {/* ドットインジケーター */}
      <div style={{display:"flex",gap:8,marginBottom:24}}>
        {pages.map((_,i)=>(
          <div key={i} style={{
            width:i===page?24:8,height:8,borderRadius:4,
            background:i===page?"var(--accent)":"var(--border)",
            transition:"all 0.3s"
          }}/>
        ))}
      </div>

      {/* ボタン */}
      <div style={{display:"flex",gap:10,width:"100%",maxWidth:360}}>
        {page>0&&(
          <button onClick={()=>setPage(page-1)} style={{
            ...S.btn,flex:1,padding:"14px 0",borderRadius:12,
            background:"#F1F0EE",color:"var(--text-sub)",fontSize:15,fontWeight:500
          }}>もどる</button>
        )}
        <button onClick={()=>{
          if(isLast){localStorage.setItem(ONBOARDING_KEY,"1");onDone();}
          else setPage(page+1);
        }} style={{
          ...S.btn,flex:1,padding:"14px 0",borderRadius:12,
          background:"var(--accent)",color:"white",fontSize:15,fontWeight:600,
          boxShadow:"0 4px 16px rgba(192,95,56,0.3)"
        }}>{isLast?"始めよう！":"つぎへ"}</button>
      </div>

      {/* スキップ */}
      {!isLast&&(
        <button onClick={()=>{localStorage.setItem(ONBOARDING_KEY,"1");onDone();}}
          style={{...S.btn,background:"transparent",color:"var(--text-muted)",fontSize:12,marginTop:16,padding:"8px 16px"}}>
          スキップ
        </button>
      )}
    </div>
  );
}

// ═══════════════════════════════════════
// プライバシーバナー（設定タブ内にも常時表示）
// ═══════════════════════════════════════
function PrivacyBanner(){
  return(
    <div style={{
      ...S.card,padding:16,
      background:"linear-gradient(135deg, #EDF5E6 0%, #DDEBD2 100%)",
      border:"none"
    }}>
      <div style={{display:"flex",gap:10,alignItems:"flex-start"}}>
        <div style={{width:32,height:32,borderRadius:10,background:"rgba(62,142,90,0.18)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontSize:16}}>🔒</div>
        <div>
          <p style={{fontSize:12,fontWeight:700,color:"var(--text)",margin:"0 0 4px"}}>プライバシーについて</p>
          <p style={{fontSize:11,color:"var(--text-sub)",lineHeight:1.6,margin:0}}>
            あなたの記録はすべて、このスマホ（ブラウザ）の中だけに保存されます。
            インターネットに送信されることはありません。アカウント登録も不要です。
          </p>
        </div>
      </div>
    </div>
  );
}

// App
function App(){
  const[showOnboarding,setShowOnboarding]=useState(()=>!localStorage.getItem(ONBOARDING_KEY));
  const{state}=useDiaryCtx();
  const tab=()=>{switch(state.activeTab){case"home":return<HomeTab/>;case"calendar":return<CalendarTab/>;case"report":return<ReportTab/>;case"selfcare":return<SelfCareTab/>;case"zukan":return<ZukanTab/>;case"settings":return<SettingsTab/>;}};
  if(showOnboarding) return <Onboarding onDone={()=>setShowOnboarding(false)}/>;
  return<Layout>{tab()}</Layout>;
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <React.StrictMode><DiaryProvider><App/></DiaryProvider></React.StrictMode>
);
</script>
</body>
</html>
