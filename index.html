const TIME_SLOTS = ["morning", "afternoon", "evening", "night"];

// ═══════════════════════════════════════
function toDateString(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function today() { return toDateString(new Date()); }
function formatDateJP(s) { const d=new Date(s); return `${d.getMonth()+1}/${d.getDate()}(${DAY_LABELS[d.getDay()]})`; }
function getCurrentTimeSlot() { const h=new Date().getHours(); if(h>=6&&h<11) return "morning"; if(h>=11&&h<15) return "afternoon"; if(h>=15&&h<19) return "evening"; return "night"; }
function getDaysInMonth(y,m) { return new Date(y,m+1,0).getDate(); }
function getFirstDayOfMonth(y,m) { return new Date(y,m,1).getDay(); }
function getWeekRange(date) { const d=new Date(date), day=d.getDay(), diff=day===0?-6:1-day; const mon=new Date(d); mon.setDate(d.getDate()+diff); mon.setHours(0,0,0,0); const sun=new Date(mon); sun.setDate(mon.getDate()+6); return {start:mon,end:sun}; }
function getWeekDates(date) { const{start}=getWeekRange(date); return Array.from({length:7},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);return toDateString(d);}); }
function getWeekKey(date) { const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate())); const dn=d.getUTCDay()||7; d.setUTCDate(d.getUTCDate()+4-dn); const ys=new Date(Date.UTC(d.getUTCFullYear(),0,1)); const w=Math.ceil(((d.getTime()-ys.getTime())/86400000+1)/7); return `${d.getUTCFullYear()}-W${String(w).padStart(2,'0')}`; }

// Score → color (bright palette)
const SCORE_COLORS = [[-5,"#D9704F"],[-3,"#E89A6B"],[-1,"#E8B94F"],[0,"#B8AE9E"],[1,"#A3CDA8"],[3,"#6FBF8B"],[5,"#3E8E5A"]];
function getScoreColor(score) {
  const c=Math.max(-5,Math.min(5,score));
  for(let i=0;i<SCORE_COLORS.length-1;i++){
    const[sA,cA]=SCORE_COLORS[i],[sB]=SCORE_COLORS[i+1];
    if(c>=sA&&c<=sB){
      const t=(c-sA)/(sB-sA);
      const a=hexToRgb(SCORE_COLORS[i][1]),b=hexToRgb(SCORE_COLORS[i+1][1]);
      return `rgb(${Math.round(a[0]+(b[0]-a[0])*t)},${Math.round(a[1]+(b[1]-a[1])*t)},${Math.round(a[2]+(b[2]-a[2])*t)})`;
    }
  }
  return "#B2BEC3";
}
function hexToRgb(hex) { const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16); return [r,g,b]; }

function pickOmamori(dateStr, score){
  let h = 0; const s = dateStr + String(score);
  for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) >>> 0; }
  return OMAMORI[h % OMAMORI.length];
}

function getScoreFace(s) {
  // Simple geometric faces using CSS
  if(s<=-4) return {mouth:"sad2",eyes:"sad",color:"#D9704F"};
  if(s<=-2) return {mouth:"sad",eyes:"normal",color:"#E89A6B"};
  if(s<=0) return {mouth:"flat",eyes:"normal",color:"#B8AE9E"};
  if(s<=2) return {mouth:"smile",eyes:"normal",color:"#6FBF8B"};
  if(s<=4) return {mouth:"happy",eyes:"happy",color:"#3E8E5A"};
  return {mouth:"grin",eyes:"happy",color:"#3E8E5A"};
}

// Face component
function FaceIcon({score, size=40}) {
  const f = getScoreFace(score);
  const r = size/2;
  const eyeR = size*0.06;
  const eyeY = r*0.7;
  const eyeSpread = r*0.35;
  const mouthY = r*1.2;

  let mouthPath;
  switch(f.mouth) {
    case "grin": mouthPath = `M${r-r*0.35},${mouthY} Q${r},${mouthY+r*0.45} ${r+r*0.35},${mouthY}`; break;
    case "happy": mouthPath = `M${r-r*0.3},${mouthY} Q${r},${mouthY+r*0.35} ${r+r*0.3},${mouthY}`; break;
    case "smile": mouthPath = `M${r-r*0.25},${mouthY} Q${r},${mouthY+r*0.2} ${r+r*0.25},${mouthY}`; break;
    case "flat": mouthPath = `M${r-r*0.2},${mouthY} L${r+r*0.2},${mouthY}`; break;
    case "sad": mouthPath = `M${r-r*0.25},${mouthY+r*0.12} Q${r},${mouthY-r*0.12} ${r+r*0.25},${mouthY+r*0.12}`; break;
    case "sad2": mouthPath = `M${r-r*0.3},${mouthY+r*0.2} Q${r},${mouthY-r*0.2} ${r+r*0.3},${mouthY+r*0.2}`; break;
  }

  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={r} cy={r} r={r-1} fill={f.color} opacity="0.15"/>
      <circle cx={r-eyeSpread} cy={eyeY} r={eyeR} fill={f.color}/>
      <circle cx={r+eyeSpread} cy={eyeY} r={eyeR} fill={f.color}/>
      {f.eyes==="happy" && <>
        <line x1={r-eyeSpread-eyeR*1.2} y1={eyeY-eyeR*0.5} x2={r-eyeSpread} y2={eyeY-eyeR*1.5} stroke={f.color} strokeWidth={1.5} strokeLinecap="round"/>
        <line x1={r-eyeSpread} y1={eyeY-eyeR*1.5} x2={r-eyeSpread+eyeR*1.2} y2={eyeY-eyeR*0.5} stroke={f.color} strokeWidth={1.5} strokeLinecap="round"/>
        <line x1={r+eyeSpread-eyeR*1.2} y1={eyeY-eyeR*0.5} x2={r+eyeSpread} y2={eyeY-eyeR*1.5} stroke={f.color} strokeWidth={1.5} strokeLinecap="round"/>
        <line x1={r+eyeSpread} y1={eyeY-eyeR*1.5} x2={r+eyeSpread+eyeR*1.2} y2={eyeY-eyeR*0.5} stroke={f.color} strokeWidth={1.5} strokeLinecap="round"/>
      </>}
      {f.eyes==="sad" && <>
        <line x1={r-eyeSpread-eyeR*1.2} y1={eyeY-eyeR*1.5} x2={r-eyeSpread+eyeR*1.2} y2={eyeY-eyeR*0.3} stroke={f.color} strokeWidth={1.5} strokeLinecap="round"/>
        <line x1={r+eyeSpread-eyeR*1.2} y1={eyeY-eyeR*0.3} x2={r+eyeSpread+eyeR*1.2} y2={eyeY-eyeR*1.5} stroke={f.color} strokeWidth={1.5} strokeLinecap="round"/>
      </>}
      <path d={mouthPath} fill="none" stroke={f.color} strokeWidth={2} strokeLinecap="round"/>
    </svg>
  );
}

// Analytics
function averageScore(e){if(!e.length)return null; return e.reduce((a,x)=>a+x.score,0)/e.length;}
function averageByTimeSlot(entries){const r={};for(const s of TIME_SLOTS){const se=entries.filter(e=>e.timeSlot===s);r[s]={avg:averageScore(se),count:se.length};}return r;}
function findBestWorst(entries){if(!entries.length)return{best:null,worst:null};let b=entries[0],w=entries[0];for(const e of entries){if(e.score>b.score)b=e;if(e.score<w.score)w=e;}return{best:b,worst:w};}
function generateInsights(entries,prev){
  const ins=[];
  if(!entries.length){ins.push("今週はまだ記録がありません。少しずつ始めてみましょう!");return ins;}
  const rate=Math.round((entries.length/28)*100);
  ins.push(`28スロット中 ${entries.length}スロット記録 — 達成率 ${rate}%`);
  const avg=averageScore(entries);
  if(avg!==null) ins.push(`今週の平均: ${avg>=0?"+":""}${avg.toFixed(1)}`);
  const pAvg=averageScore(prev);
  if(avg!==null&&pAvg!==null){const diff=avg-pAvg;if(Math.abs(diff)>=0.3)ins.push(`前週比 ${diff>0?"+":""}${diff.toFixed(1)} ${diff>0?"UP!":"DOWN"}`);else ins.push("前週とほぼ同じペースです");}
  const bs=averageByTimeSlot(entries);let ws=null,wa=Infinity;for(const s of TIME_SLOTS){if(bs[s].avg!==null&&bs[s].avg<wa){wa=bs[s].avg;ws=s;}}
  if(ws)ins.push(`${TIME_SLOT_CONFIG[ws].label}のスコアが低めの傾向 → 過ごし方を工夫してみては?`);
  return ins;
}

function sGet(k,fb){try{const r=localStorage.getItem(k);return r===null?fb:JSON.parse(r);}catch{return fb;}}

function saveEntries(e){sSet(KEYS.entries,e);}

function saveWeeklyNotes(n){sSet(KEYS.weeklyNotes,n);}
function loadSettings(){return sGet(KEYS.settings,{userName:"",notificationsEnabled:false});}
function saveSettings(s){sSet(KEYS.settings,s);}

// AI分析用テキスト生成
function formatForAI(entries, stateGuide){
  const sorted = [...entries].sort((a,b)=>a.date.localeCompare(b.date)||TIME_SLOTS.indexOf(a.timeSlot)-TIME_SLOTS.indexOf(b.timeSlot));
  const dateGroups = {};
  for(const e of sorted){
    if(!dateGroups[e.date]) dateGroups[e.date]=[];
    dateGroups[e.date].push(e);
  }

  let out = `# きもち日記データ（AI分析用）\n`;
  out += `エクスポート日時: ${new Date().toLocaleString("ja-JP")}\n`;
  out += `記録件数: ${entries.length}件\n\n`;

  // 状態表
  out += `## じぶんの状態表（-5〜+5）\n`;
  out += `| スコア | 状態 | 行動の様子 | セルフケア |\n`;
  out += `|--------|------|------------|------------|\n`;
  for(const k of STATE_KEYS){
    const g = (stateGuide && stateGuide[k]) || DEFAULT_STATE_GUIDE[k];
    out += `| ${k.padStart(3)} | ${g.title} | ${g.behavior} | ${g.selfCare.join("／")} |\n`;
  }
  out += `\n`;

  // 日別データ
  out += `## 日別の記録\n`;
  for(const[date,es] of Object.entries(dateGroups)){
    const d = new Date(date);
    const avg = averageScore(es);
    out += `### ${date}（${DAY_LABELS[d.getDay()]}）平均: ${avg!==null?(avg>=0?"+":"")+avg.toFixed(1):"---"}\n`;
    for(const e of es){
      const cfg = TIME_SLOT_CONFIG[e.timeSlot];
      out += `- ${cfg.label}（${cfg.timeRange}）: ${e.score>=0?"+":""}${e.score}`;
      if(e.comment) out += ` 「${e.comment}」`;
      out += `\n`;
    }
    out += `\n`;
  }

  // 集計
  if(entries.length > 0){
    const totalAvg = averageScore(entries);
    const bySlot = averageByTimeSlot(entries);
    out += `## 集計\n`;
    out += `- 全体の平均: ${totalAvg!==null?(totalAvg>=0?"+":"")+totalAvg.toFixed(2):"---"}\n`;
    for(const s of TIME_SLOTS){
      const a = bySlot[s];
      out += `- ${TIME_SLOT_CONFIG[s].label}の平均: ${a.avg!==null?(a.avg>=0?"+":"")+a.avg.toFixed(2):"---"}（${a.count}件）\n`;
    }
    out += `\n`;
  }

  out += `---\n`;
  out += `このデータをもとに、以下のような分析・可視化ができます：\n`;
  out += `・時系列グラフ（日別 / 週別の推移）\n`;
  out += `・時間帯別の傾向分析\n`;
  out += `・コメントの感情分析\n`;
  out += `・セルフケア提案の改善\n`;
  out += `・気分の波のパターン発見\n`;

  return out;
}

const DiaryCtx=createContext();
function diaryReducer(state,action){
  switch(action.type){
    case "ADD_ENTRY":{const entries=[...state.entries,action.entry];saveEntries(entries);return{...state,entries};}
    case "UPDATE_ENTRY":{const entries=state.entries.map(e=>e.id===action.entry.id?action.entry:e);saveEntries(entries);return{...state,entries};}
    case "DELETE_ENTRY":{const entries=state.entries.filter(e=>e.id!==action.id);saveEntries(entries);return{...state,entries};}
    case "SET_WEEKLY_NOTE":{const wn={...state.weeklyNotes,[action.weekKey]:action.note};saveWeeklyNotes(wn);return{...state,weeklyNotes:wn};}
    case "UPDATE_SETTINGS":{const s={...state.settings,...action.settings};saveSettings(s);return{...state,settings:s};}
    case "UPDATE_STATE_GUIDE":{const g={...state.stateGuide,[action.key]:{...state.stateGuide[action.key],...action.patch}};saveStateGuide(g);return{...state,stateGuide:g};}
    case "RESET_STATE_GUIDE":{const g=cloneDefaultGuide();saveStateGuide(g);return{...state,stateGuide:g};}
    case "ADD_CARE_LOG":{const careLog=[...state.careLog,action.log];saveCareLog(careLog);return{...state,careLog};}
    case "SET_CARE_EFFECT":{const careLog=state.careLog.map(l=>l.id===action.id?{...l,effect:action.effect}:l);saveCareLog(careLog);return{...state,careLog};}
    case "DELETE_CARE_LOG":{const careLog=state.careLog.filter(l=>l.id!==action.id);saveCareLog(careLog);return{...state,careLog};}
    case "ADD_MY_CARE":{const myCare=[...state.myCare,action.item];saveMyCare(myCare);return{...state,myCare};}
    case "DELETE_MY_CARE":{const myCare=state.myCare.filter(m=>m.id!==action.id);saveMyCare(myCare);return{...state,myCare};}
    case "UPDATE_CRISIS":{const crisis={...state.crisis,...action.crisis};saveCrisis(crisis);return{...state,crisis};}
    case "SET_TAB":return{...state,activeTab:action.tab};
    case "LOAD":return{...state,entries:action.entries,weeklyNotes:action.weeklyNotes,settings:action.settings,stateGuide:action.stateGuide,careLog:action.careLog,myCare:action.myCare,crisis:action.crisis};
    default:return state;
  }
}

// 提案エンジン：スコア×実績（効いた記録）でライブラリから選ぶ
// ═══════════════════════════════════════
function effectScore(itemId, careLog){
  // 効いた=+2 / まあまあ=+1 / 合わなかった=-2（直近ほど重く）
  let s = 0;
  const logs = careLog.filter(l=>l.itemId===itemId && l.effect);
  logs.slice(-10).forEach((l,i)=>{
    const w = 1 + i*0.1;
    if(l.effect==="good") s += 2*w;
    else if(l.effect==="soso") s += 1*w;
    else if(l.effect==="bad") s -= 2*w;
  });
  return s;
}
function suggestCare(score, careLog, myCare, count=4){
  let inRange = CARE_ITEMS.filter(it=>score>=it.states[0]&&score<=it.states[1]&&!it.noSuggest);
  // 深い低調(-4以下)では「考える」系は機能しない——体からのみ
  if(score<=-4) inRange = inRange.filter(it=>it.cat!=="think");
  // 上がりすぎ(+4以上)では活動を煽る項目を出さない（睡眠と鎮静を守る）
  if(score>=4) inRange = inRange.filter(it=>!it.hype);
  const my = (myCare||[]).map(m=>({...m, id:"my:"+m.id, states:[-5,5], my:true}));
  const pool = [...inRange, ...my];
  // スコア帯ごとの優先: 低い時=体から / ふつう=気持ち・学習 / 良い時=キープと貯金
  const catPriority =
    score<=-4 ? {now:0,feel:1,base:2,fit:3,joy:4,think:9}
    : score<=-2 ? {now:0,base:1,feel:2,joy:3,fit:4,think:5}
    : score<=0  ? {feel:0,base:1,think:2,joy:3,fit:4,now:5}
    : score<=2  ? {joy:0,base:1,fit:2,feel:3,think:4,now:5}
    : {fit:0,base:1,joy:2,now:3,feel:4,think:5};
  // 低調時は選ぶこと自体が負荷——3つまでに絞る
  const limit = score<=-3 ? Math.min(count,3) : count;
  const scored = pool.map(it=>({
    it,
    // +4以上では「上がりすぎ専用」項目（states下限が+3以上）を最優先に浮かせる
    key: (it.my?1:0)*5 + effectScore(it.id,careLog)*10 - (catPriority[it.cat]??2)
      + (score>=4 && it.states && it.states[0]>=3 ? 8 : 0)
  }));
  scored.sort((a,b)=>b.key-a.key);
  // 同カテゴリばかりにならないよう軽く分散
  const out=[]; const usedCat={};
  for(const s of scored){
    if(out.length>=limit) break;
    const c=s.it.cat||"my";
    if((usedCat[c]||0)>=2 && scored.length>limit) continue;
    usedCat[c]=(usedCat[c]||0)+1;
    out.push(s.it);
  }
  return out;
}
function isLowStreak(entries, days=2, threshold=-3){
  // 直近days日の平均がthreshold以下の日が続いているか
  let streak=0;
  for(let i=0;i<days;i++){
    const d=new Date(); d.setDate(d.getDate()-i);
    const ds=toDateString(d);
    const avg=averageScore(entries.filter(e=>e.date===ds));
    if(avg!==null && avg<=threshold) streak++;
  }
  return streak>=days;
}
function DiaryProvider({children}){
  const[state,dispatch]=useReducer(diaryReducer,{entries:[],weeklyNotes:{},settings:{userName:"",notificationsEnabled:false},stateGuide:cloneDefaultGuide(),careLog:[],myCare:[],crisis:{staff:"",doctor:"",hotline:""},activeTab:"home"});

  return <DiaryCtx.Provider value={{state,dispatch}}>{children}</DiaryCtx.Provider>;
}

// 今日の手当てカード（スコアから提案）
function CareSuggest({score, compact=false}){
  const{state,dispatch}=useDiaryCtx();
  const[showCrisis,setShowCrisis]=useState(false);
  const[refreshKey,setRefreshKey]=useState(0);
  const items = useMemo(()=>suggestCare(score, state.careLog, state.myCare, compact?3:4),[score, state.careLog, state.myCare, refreshKey, compact]);
  const isLow = score<=-4;
  const omamori = isLow ? pickOmamori(today(), score) : null;
  return(
    <div style={{marginTop:12}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:2}}>
        <p style={{fontSize:10,margin:0,fontWeight:700,letterSpacing:"0.05em",color:"var(--accent)"}}>🩹 今日の手当て — 1つだけでいい</p>
        <button onClick={()=>setRefreshKey(k=>k+1)} style={{...S.btn,fontSize:10,color:"var(--text-muted)",background:"transparent",padding:"2px 6px"}}>↻ 別のを見る</button>
      </div>
      {items.map(it=><CareItemRow key={it.id} item={it} careLog={state.careLog} dispatch={dispatch} score={score} compact={compact}/>)}
      {omamori && (
        <div className="fade-up" style={{marginTop:10,padding:"10px 14px",borderLeft:"4px solid #D98BAF",background:"#FCF2F6",borderRadius:"0 10px 10px 0"}}>

  );
}

// MiniGraph
function MiniGraph({entries}){
  const data=useMemo(()=>{
    const days=[];
    for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const ds=toDateString(d);const de=entries.filter(e=>e.date===ds);days.push({label:DAY_LABELS[d.getDay()],avg:averageScore(de)});}
    return days;
  },[entries]);
  if(!data.some(d=>d.avg!==null)) return(
    <div style={{...S.card,textAlign:"center",padding:24}}>
      <p style={{fontSize:13,color:"var(--text-muted)"}}>書き始めると、7日間のグラフが出るよ</p>
    </div>
  );
  return(
    <div style={S.card}>
      <h3 style={{fontSize:12,fontWeight:600,color:"var(--text-sub)",marginBottom:12}}>1週間の流れ</h3>
      <ResponsiveContainer width="100%" height={100}>
        <LineChart data={data} margin={{top:5,right:5,bottom:0,left:-25}}>
          <XAxis dataKey="label" axisLine={false} tickLine={false} tick={{fontSize:10,fill:"var(--text-muted)"}}/>
          <YAxis domain={[-5,5]} axisLine={false} tickLine={false} tick={{fontSize:9,fill:"var(--text-muted)"}} ticks={[-5,0,5]}/>
          <ReferenceLine y={0} stroke="var(--border)" strokeDasharray="3 3"/>
          <Line type="monotone" dataKey="avg" stroke="var(--accent)" strokeWidth={2.5} dot={{r:3.5,fill:"var(--accent)",strokeWidth:2,stroke:"white"}} connectNulls/>
        </LineChart>
      </ResponsiveContainer>
    </div>
  );
}

// Calendar Tab
function CalendarTab(){
  const{state,dispatch}=useDiaryCtx();
  const now=new Date();
  const[year,setYear]=useState(now.getFullYear());
  const[month,setMonth]=useState(now.getMonth());
  const[selectedDate,setSelectedDate]=useState(null);
  const[editSlot,setEditSlot]=useState(null);
  const dim=getDaysInMonth(year,month);
  const fdow=getFirstDayOfMonth(year,month);
  const todayStr=today();
  const dayScores=useMemo(()=>{const m={};for(let d=1;d<=dim;d++){const ds=toDateString(new Date(year,month,d));m[ds]=averageScore(state.entries.filter(e=>e.date===ds));}return m;},[state.entries,year,month,dim]);
  const goPrev=()=>{if(month===0){setYear(year-1);setMonth(11);}else setMonth(month-1);};
  const goNext=()=>{if(month===11){setYear(year+1);setMonth(0);}else setMonth(month+1);};
  const selEntries=selectedDate?state.entries.filter(e=>e.date===selectedDate):[];

  return(
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <button onClick={goPrev} style={{...S.btn,width:36,height:36,borderRadius:18,background:"var(--card)",color:"var(--text-sub)",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"var(--shadow-sm)"}}>←</button>
        <h2 style={{fontSize:17,fontWeight:700}}>{year}年 {MONTH_LABELS[month]}</h2>
        <button onClick={goNext} style={{...S.btn,width:36,height:36,borderRadius:18,background:"var(--card)",color:"var(--text-sub)",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"var(--shadow-sm)"}}>→</button>
      </div>
      <div style={{...S.card,padding:16}}>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4}}>
          {DAY_LABELS.map((d,i)=><div key={d} style={{textAlign:"center",fontSize:10,fontWeight:600,padding:4,color:i===0?"#E17055":i===6?"#74b9ff":"var(--text-muted)"}}>{d}</div>)}
          {Array.from({length:fdow}).map((_,i)=><div key={`e${i}`}/>)}
          {Array.from({length:dim}).map((_,i)=>{
            const day=i+1,ds=toDateString(new Date(year,month,day)),avg=dayScores[ds],isToday=ds===todayStr,isSel=ds===selectedDate;
            const bg=avg!==null?getScoreColor(avg):"transparent";
            return(
              <button key={day} onClick={()=>setSelectedDate(ds)}
                style={{...S.btn,aspectRatio:"1",display:"flex",alignItems:"center",justifyContent:"center",borderRadius:10,fontSize:12,fontWeight:isToday?700:400,
                  background:avg!==null?bg.replace("rgb","rgba").replace(")",",0.2)"):"transparent",
                  border:isSel?"2px solid var(--accent)":isToday?"2px solid var(--accent-light)":"2px solid transparent",
                  color:isToday?"var(--accent)":"var(--text)"}}>
                {day}
              </button>
            );
          })}
        </div>
      </div>
      {/* Legend */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,fontSize:10,color:"var(--text-muted)"}}>
        <span style={{width:10,height:10,borderRadius:3,background:"rgba(217,112,79,0.3)",display:"inline-block"}}/>つらい
        <span style={{width:10,height:10,borderRadius:3,background:"rgba(184,174,158,0.3)",display:"inline-block",marginLeft:6}}/>ふつう
        <span style={{width:10,height:10,borderRadius:3,background:"rgba(62,142,90,0.28)",display:"inline-block",marginLeft:6}}/>うれしい
      </div>

      {selectedDate&&(
        <Modal onClose={()=>setSelectedDate(null)}>
          <h2 style={{fontSize:18,fontWeight:700,textAlign:"center",marginBottom:16}}>{formatDateJP(selectedDate)}</h2>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {TIME_SLOTS.map(slot=>{
              const entry=selEntries.find(e=>e.timeSlot===slot);const cfg=TIME_SLOT_CONFIG[slot];
              return(
                <button key={slot} onClick={()=>setEditSlot(slot)} style={{...S.btn,display:"flex",alignItems:"center",gap:12,background:"#F8F6F2",borderRadius:"var(--radius-sm)",padding:14,textAlign:"left",width:"100%"}}>
                  <div style={{width:40,height:40,borderRadius:12,background:cfg.gradient,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}}>{cfg.icon}</div>
                  <div style={{flex:1,minWidth:0}}>
                    <p style={{fontSize:12,fontWeight:600,color:"var(--text)",margin:0}}>{cfg.label}</p>
                    {entry?(
                      <div style={{display:"flex",alignItems:"center",gap:6,marginTop:2}}>
                        <span style={{fontSize:16,fontWeight:700,color:getScoreColor(entry.score)}}>{entry.score>0?`+${entry.score}`:entry.score}</span>
                        <FaceIcon score={entry.score} size={20}/>
                        {entry.comment&&<span style={{fontSize:11,color:"var(--text-muted)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{entry.comment}</span>}
                      </div>
                    ):<p style={{fontSize:11,color:"var(--text-muted)",margin:"2px 0 0"}}>タップして書く</p>}
                  </div>
                </button>
              );
            })}
          </div>
          <button onClick={()=>setSelectedDate(null)} style={{...S.btn,width:"100%",marginTop:16,padding:"10px 0",borderRadius:"var(--radius-sm)",background:"#F1F0EE",color:"var(--text-sub)",fontSize:14,fontWeight:500}}>閉じる</button>
        </Modal>
      )}
      {editSlot&&<ScoreInputModal slot={editSlot} date={selectedDate} onClose={()=>setEditSlot(null)} entries={state.entries} dispatch={dispatch}/>}
    </div>
  );
}

  { key:"1m", label:"1ヶ月",  days:30 },
  { key:"2m", label:"2ヶ月",  days:60 },
  { key:"3m", label:"3ヶ月",  days:90 },
];

function getDateRange(endDate, days) {
  const dates = [];
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(endDate);
    d.setDate(d.getDate() - i);
    dates.push(toDateString(d));
  }
  return dates;
}

function getPrevRange(endDate, days) {
  const d = new Date(endDate);
  d.setDate(d.getDate() - days);
  return getDateRange(d, days);
}

function buildChartData(dates, entries, rangeKey) {
  // Group dates intelligently based on range
  if (rangeKey === "1w") {
    // Daily
    return dates.map(date => {
      const de = entries.filter(e => e.date === date);
      const d = new Date(date);
      const r = { date, label: `${d.getMonth()+1}/${d.getDate()}`, avg: averageScore(de) };
      for (const s of TIME_SLOTS) { const entry = de.find(e => e.timeSlot === s); r[s] = entry ? entry.score : null; }
      return r;
    });
  } else if (rangeKey === "2w") {
    // Daily
    return dates.map(date => {
      const de = entries.filter(e => e.date === date);
      const d = new Date(date);
      const r = { date, label: `${d.getMonth()+1}/${d.getDate()}`, avg: averageScore(de) };
      for (const s of TIME_SLOTS) { const entry = de.find(e => e.timeSlot === s); r[s] = entry ? entry.score : null; }
      return r;
    });
  } else {
    // Group by week for 1m/2m/3m
    const weeks = [];
    let chunk = [];
    dates.forEach((date, i) => {
      chunk.push(date);
      const d = new Date(date);
      if (d.getDay() === 0 || i === dates.length - 1) {
        const wEntries = entries.filter(e => chunk.includes(e.date));
        const startD = new Date(chunk[0]);
        const r = { date: chunk[0], label: `${startD.getMonth()+1}/${startD.getDate()}~`, avg: averageScore(wEntries) };
        for (const s of TIME_SLOTS) {
          const slotE = wEntries.filter(e => e.timeSlot === s);
          r[s] = averageScore(slotE);
        }
        weeks.push(r);
        chunk = [];
      }
    });
    return weeks;
  }
}

function generateRangeInsights(entries, prevEntries, days, rangeLabel) {
  const ins = [];
  if (!entries.length) { ins.push("まだ書いてないよ。少しずつ始めよう！"); return ins; }
  const totalSlots = Math.round(days * 4);
  const rate = Math.round((entries.length / totalSlots) * 100);
  ins.push(`${totalSlots}回のうち ${entries.length}回 書いたよ（${rate}%）`);
  const avg = averageScore(entries);
  if (avg !== null) ins.push(`${rangeLabel}の平均: ${avg >= 0 ? "+" : ""}${avg.toFixed(1)}`);
  const pAvg = averageScore(prevEntries);
  if (avg !== null && pAvg !== null) {
    const diff = avg - pAvg;
    if (Math.abs(diff) >= 0.3) ins.push(`前と比べて ${diff > 0 ? "+" : ""}${diff.toFixed(1)} ${diff > 0 ? "上がった！" : "下がった"}`);
    else ins.push("前と同じくらいだよ");
  }
  const bs = averageByTimeSlot(entries);
  let ws = null, wa = Infinity, bsSlot = null, ba = -Infinity;
  for (const s of TIME_SLOTS) {
    if (bs[s].avg !== null && bs[s].avg < wa) { wa = bs[s].avg; ws = s; }
    if (bs[s].avg !== null && bs[s].avg > ba) { ba = bs[s].avg; bsSlot = s; }
  }
  if (bsSlot && ws && bsSlot !== ws) {
    ins.push(`${TIME_SLOT_CONFIG[bsSlot].label}が一番良い（${ba >= 0 ? "+" : ""}${ba.toFixed(1)}）、${TIME_SLOT_CONFIG[ws].label}は少し低いね（${wa >= 0 ? "+" : ""}${wa.toFixed(1)}）`);
  } else if (ws) {
    ins.push(`${TIME_SLOT_CONFIG[ws].label}のきもちが低いみたい → 過ごし方を変えてみよう`);
  }
  // Score trend (first half vs second half)
  if (entries.length >= 8) {
    const mid = Math.floor(entries.length / 2);
    const sorted = [...entries].sort((a,b) => a.date.localeCompare(b.date));
    const firstHalf = averageScore(sorted.slice(0, mid));
    const secondHalf = averageScore(sorted.slice(mid));
    if (firstHalf !== null && secondHalf !== null) {
      const trend = secondHalf - firstHalf;
      if (trend > 0.5) ins.push(`だんだん良くなってきてるよ ↗ (+${trend.toFixed(1)})`);
      else if (trend < -0.5) ins.push(`少し下がってきてるかも ↘ (${trend.toFixed(1)})`);
      else ins.push("ずっと落ち着いてるね");
    }
  }
  return ins;
}

    </div>
  );
}

// ═══════════════════════════════════════
// こんな時は？（状況ナビ）— PDFの感情ナビのアプリ版
// ═══════════════════════════════════════
function SituationNav(){
  const{state,dispatch}=useDiaryCtx();
  const[selSit,setSelSit]=useState(null);
  const[sceneFilter,setSceneFilter]=useState("all");
  const[addText,setAddText]=useState("");
  const[addedMsg,setAddedMsg]=useState(null);

  const sit = SITUATIONS.find(s=>s.id===selSit);
  const items = useMemo(()=>{
    if(!selSit) return [];
    let r = CARE_ITEMS.filter(it=>it.sit.includes(selSit));
    if(sceneFilter!=="all") r = r.filter(it=>it.scene===sceneFilter||it.scene==="any");
    // 効いた実績が高い順
    return r.sort((a,b)=>effectScore(b.id,state.careLog)-effectScore(a.id,state.careLog));
  },[selSit,sceneFilter,state.careLog]);

  const quickAdd=()=>{
    const t=addText.trim();
    if(!t) return;
    dispatch({type:"ADD_MY_CARE",item:{id:crypto.randomUUID(),text:t,cat:"my",scene:"any",createdAt:new Date().toISOString()}});
    setAddText("");
    setAddedMsg("追加したよ！記録した時の提案にも出てくるよ");
    setTimeout(()=>setAddedMsg(null),2500);
  };

  if(!selSit){
    // 状況グリッド
    const cats=["now","feel","think","base","fit","joy"];
    return(
      <div style={{display:"flex",flexDirection:"column",gap:14}}>
        <div style={{...S.card,padding:18,background:"linear-gradient(135deg, #FDF3E3 0%, #F9E6CE 100%)",border:"none"}}>
          <p style={{fontSize:11,fontWeight:700,color:"var(--accent)",letterSpacing:"0.05em",margin:0}}>こんな時は？</p>
          <h2 style={{fontSize:17,fontWeight:700,margin:"4px 0 6px"}}>今の状態に近いものをタップ</h2>
          <p style={{fontSize:12,color:"var(--text-sub)",lineHeight:1.6,margin:0}}>
            しんどい時ほど、探すのは大変。近いものを1つ選べば、合った手当てが出てくるよ。全部やらなくていい、1つで十分。
          </p>
        </div>
        {cats.map(catKey=>{
          const cat=CARE_CATEGORIES[catKey];
          const sits=SITUATIONS.filter(s=>s.cat===catKey);
          if(!sits.length) return null;
          return(
            <div key={catKey}>
              <p style={{fontSize:11,fontWeight:700,color:cat.color,margin:"0 0 6px",letterSpacing:"0.03em"}}>{cat.icon} {cat.sub}</p>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                {sits.map(s=>(
                  <button key={s.id} onClick={()=>{setSelSit(s.id);setSceneFilter("all");}}
                    style={{...S.btn,display:"flex",alignItems:"center",gap:8,padding:"12px 12px",borderRadius:12,textAlign:"left",
                      background:"var(--card)",border:`1px solid ${cat.color}22`,boxShadow:"var(--shadow-sm)"}}>
                    <span style={{fontSize:17,flexShrink:0}}>{s.icon}</span>
                    <span style={{fontSize:13,fontWeight:600,color:"var(--text)",lineHeight:1.45}}>{s.label}</span>
                  </button>
                ))}
              </div>
            </div>
          );
        })}
        {/* じぶんのケアを追加 */}
        <div style={S.card}>
          <p style={{fontSize:12,fontWeight:700,color:"var(--text)",margin:"0 0 4px"}}>⭐ じぶんのセルフケアを追加</p>
          <p style={{fontSize:11,color:"var(--text-muted)",margin:"0 0 8px"}}>ここにない「わたしに効くこと」を足しておこう</p>
          <div style={{display:"flex",gap:8}}>
            <input type="text" value={addText} onChange={e=>setAddText(e.target.value)} placeholder="例：推しの曲を1曲きく"
              style={{...S.input,fontSize:13}} onKeyDown={e=>{if(e.key==="Enter")quickAdd();}}/>
            <button onClick={quickAdd} style={{...S.btn,flexShrink:0,padding:"0 16px",borderRadius:"var(--radius-sm)",background:"var(--accent)",color:"white",fontSize:13,fontWeight:600}}>追加</button>
          </div>
          {addedMsg&&<p className="fade-up" style={{fontSize:11,color:"var(--positive)",margin:"6px 0 0"}}>✓ {addedMsg}</p>}
          {state.myCare.length>0&&(
            <div style={{marginTop:10}}>
              {state.myCare.map(m=>(
                <div key={m.id} style={{display:"flex",gap:8,alignItems:"center",padding:"6px 0",borderTop:"1px solid var(--border)"}}>
                  <span style={{fontSize:12}}>⭐</span>
                  <span style={{flex:1,fontSize:12.5,color:"var(--text)"}}>{m.text}</span>
                  <button onClick={()=>dispatch({type:"DELETE_MY_CARE",id:m.id})} style={{...S.btn,fontSize:11,color:"var(--text-muted)",background:"transparent",padding:"2px 6px"}}>削除</button>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    );
  }

  // 状況の詳細（項目リスト）
  const cat=CARE_CATEGORIES[sit.cat];
  return(
    <div style={{display:"flex",flexDirection:"column",gap:12}}>
      <button onClick={()=>setSelSit(null)} style={{...S.btn,alignSelf:"flex-start",fontSize:12,color:"var(--text-sub)",background:"var(--card)",padding:"8px 14px",borderRadius:18,boxShadow:"var(--shadow-sm)",border:"1px solid var(--border)"}}>← もどる</button>
      <div style={{...S.card,padding:16,background:cat.bg,border:"none"}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontSize:22}}>{sit.icon}</span>
          <div>
            <h2 style={{fontSize:16,fontWeight:700,margin:0}}>{sit.label}</h2>
            <p style={{fontSize:11,color:cat.color,fontWeight:600,margin:"2px 0 0"}}>{cat.icon} {cat.sub}</p>
          </div>
        </div>
      </div>
      {/* 場面フィルタ */}
      <div style={{display:"flex",gap:6}}>
        {[["all","すべて"],["work","🏢 職場で"],["home","🏠 家で"]].map(([k,l])=>(
          <button key={k} onClick={()=>setSceneFilter(k)}
            style={{...S.btn,padding:"6px 14px",borderRadius:16,fontSize:12,fontWeight:600,
              background:sceneFilter===k?cat.color:"var(--card)",color:sceneFilter===k?"white":"var(--text-sub)",
              border:sceneFilter===k?"none":"1px solid var(--border)"}}>{l}</button>
        ))}
      </div>
      <div style={{...S.card,padding:"6px 16px 10px"}}>
        {items.length===0 && <p style={{fontSize:12,color:"var(--text-muted)",textAlign:"center",padding:"14px 0"}}>この場面の項目はまだないよ。「すべて」も見てみてね</p>}
        {items.map(it=>(
          <div key={it.id}>
            <CareItemRow item={it} careLog={state.careLog} dispatch={dispatch} score={null}/>
            <AddToGuideRow item={it}/>
          </div>
        ))}
      </div>
      <p style={{fontSize:10.5,color:"var(--text-muted)",textAlign:"center",lineHeight:1.6}}>合わないと感じたら、やめて大丈夫。<br/>効かなかったのは、あなたのせいではありません。</p>
    </div>
  );
}

// 「じぶんの状態表に入れる」行
function AddToGuideRow({item}){
  const{state,dispatch}=useDiaryCtx();
  const[open,setOpen]=useState(false);
  const[done,setDone]=useState(false);
  const addTo=(key)=>{
    const row=state.stateGuide[key]||DEFAULT_STATE_GUIDE[key];
    if(!row.selfCare.includes(item.text)){
      dispatch({type:"UPDATE_STATE_GUIDE",key,patch:{selfCare:[...row.selfCare,item.text]}});
    }
    setDone(true); setOpen(false);
    setTimeout(()=>setDone(false),2000);
  };
  if(done) return <p className="fade-up" style={{fontSize:10.5,color:"var(--positive)",margin:"2px 0 8px 21px"}}>✓ じぶんの状態表に入れたよ</p>;
  return(
    <div style={{margin:"2px 0 8px 21px"}}>
      {!open ? (
        <button onClick={()=>setOpen(true)} style={{...S.btn,fontSize:10.5,color:"var(--accent)",background:"transparent",padding:"2px 0"}}>＋ じぶんの状態表に入れる</button>
      ):(
        <div className="fade-up" style={{display:"flex",gap:4,alignItems:"center",flexWrap:"wrap"}}>
          <span style={{fontSize:10.5,color:"var(--text-sub)"}}>どの状態のとき？</span>
          {STATE_KEYS.map(k=>{
            const sc=parseInt(k,10);
            return <button key={k} onClick={()=>addTo(k)} style={{...S.btn,fontSize:10.5,fontWeight:700,padding:"3px 7px",borderRadius:10,background:"var(--card)",border:"1px solid var(--border)",color:getScoreColor(sc)}}>{sc>0?`+${sc}`:sc}</button>;
          })}
          <button onClick={()=>setOpen(false)} style={{...S.btn,fontSize:10.5,color:"var(--text-muted)",background:"transparent",padding:"3px 5px"}}>やめる</button>
        </div>
      )}
    </div>
  );
}

// セルフケア（道具箱）タブ — こんな時は？ / じぶんの状態表 / よみもの
function SelfCareTab(){
  const{state,dispatch}=useDiaryCtx();
  const[view,setView]=useState("situations");
  const[expanded,setExpanded]=useState("0");
  const[showReset,setShowReset]=useState(false);
  const guide = state.stateGuide || cloneDefaultGuide();

  const update=(key,patch)=>dispatch({type:"UPDATE_STATE_GUIDE",key,patch});
  const updateSelfCareText=(key,text)=>{
    const lines = text.split("\n").map(s=>s.trim()).filter(s=>s.length>0);
    update(key,{selfCare:lines});
  };

  const segments=[["situations","🧭 こんな時は？"],["guide","📊 じぶんの状態表"],["columns","📖 よみもの"]];

  return(
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      {/* セグメント切替 */}
      <div style={{display:"flex",gap:6,background:"var(--card)",borderRadius:14,padding:4,boxShadow:"var(--shadow-sm)",border:"1px solid var(--border)"}}>
        {segments.map(([k,l])=>(
          <button key={k} onClick={()=>setView(k)}
            style={{...S.btn,flex:1,padding:"9px 0",borderRadius:10,fontSize:11.5,fontWeight:600,
              background:view===k?"var(--accent)":"transparent",color:view===k?"white":"var(--text-sub)"}}>{l}</button>
        ))}
      </div>

      {view==="situations" && <SituationNav/>}
      {view==="columns" && <ColumnsView/>}
      {view==="guide" && (<>
      {/* 説明カード */}
      <div style={{...S.card,padding:18,background:"linear-gradient(135deg, #FDF3E3 0%, #F9E6CE 100%)",border:"none"}}>
        <p style={{fontSize:11,fontWeight:700,color:"var(--accent)",letterSpacing:"0.05em",margin:0}}>じぶんの状態表</p>
        <h2 style={{fontSize:17,fontWeight:700,margin:"4px 0 6px"}}>状態とセルフケアを書こう</h2>
        <p style={{fontSize:12,color:"var(--text-sub)",lineHeight:1.6,margin:0}}>
          -5〜+5 のそれぞれに「どんな様子か」「何をすると楽になるか」を書いておくと、
          きもちを記録した時に自分専用のセルフケアが出てくるよ。
          「🧭 こんな時は？」から気に入ったものを入れることもできるよ。
        </p>
      </div>

      {/* リセットボタン */}
      <div style={{display:"flex",justifyContent:"flex-end"}}>
        {!showReset?(
          <button onClick={()=>setShowReset(true)} style={{...S.btn,fontSize:11,color:"var(--text-muted)",background:"transparent",padding:"6px 10px",borderRadius:8,border:"1px solid var(--border)"}}>
            ↺ デフォルトに戻す
          </button>
        ):(
          <div style={{display:"flex",gap:6,alignItems:"center"}}>
            <span style={{fontSize:11,color:"var(--text-sub)"}}>自分の編集が消えるよ</span>
            <button onClick={()=>setShowReset(false)} style={{...S.btn,fontSize:11,padding:"6px 10px",borderRadius:8,background:"#F1F0EE",color:"var(--text-sub)"}}>やめる</button>
            <button onClick={()=>{dispatch({type:"RESET_STATE_GUIDE"});setShowReset(false);}} style={{...S.btn,fontSize:11,padding:"6px 10px",borderRadius:8,background:"var(--negative)",color:"white",fontWeight:600}}>戻す</button>
          </div>
        )}
      </div>

      {/* 11行のカード */}
      {STATE_KEYS.map(key=>{
        const score = parseInt(key,10);
        const row = guide[key] || DEFAULT_STATE_GUIDE[key];
        const color = getScoreColor(score);
        const rgb = (color.match(/\d+/g)||["108","92","231"]).slice(0,3).join(",");
        const isOpen = expanded===key;
        const selfCareText = (row.selfCare||[]).join("\n");
        return(
          <div key={key} style={{
            background:"var(--card)",
            borderRadius:"var(--radius)",
            border:`1px solid rgba(${rgb},${isOpen?0.4:0.18})`,
            boxShadow:isOpen?"var(--shadow-md)":"var(--shadow-sm)",
            overflow:"hidden",
            transition:"all 0.2s"
          }}>
            <button onClick={()=>setExpanded(isOpen?null:key)} style={{
              ...S.btn, width:"100%", display:"flex", alignItems:"center", gap:12,
              padding:"14px 16px", background:`linear-gradient(90deg, rgba(${rgb},0.10), rgba(${rgb},0.02))`,
              textAlign:"left"
            }}>
              <div style={{
                width:42,height:42,borderRadius:12,
                background:`rgba(${rgb},0.18)`,
                display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0
              }}>
                <span style={{fontSize:16,fontWeight:800,color}}>{score>0?`+${score}`:score}</span>
              </div>
              <div style={{flex:1,minWidth:0}}>
                <p style={{fontSize:14,fontWeight:700,color:"var(--text)",margin:0,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{row.title || "（タイトル未設定）"}</p>
                <p style={{fontSize:11,color:"var(--text-muted)",margin:"2px 0 0",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>セルフケア {(row.selfCare||[]).length}件</p>
              </div>
              <FaceIcon score={score} size={26}/>
              <span style={{fontSize:14,color:"var(--text-muted)",marginLeft:4,transition:"transform 0.2s",transform:isOpen?"rotate(90deg)":"none"}}>›</span>
            </button>

            {isOpen && (
              <div style={{padding:"12px 16px 18px",borderTop:`1px dashed rgba(${rgb},0.25)`}}>
                <label style={{fontSize:11,fontWeight:600,color:"var(--text-sub)",display:"block",marginTop:6,marginBottom:4}}>状態のタイトル</label>
                <input type="text" value={row.title} onChange={e=>update(key,{title:e.target.value})}
                  placeholder="例：とても元気" style={{...S.input,fontSize:13}}
                  onFocus={e=>e.target.style.borderColor=color} onBlur={e=>e.target.style.borderColor="var(--border)"}/>

                <label style={{fontSize:11,fontWeight:600,color:"var(--text-sub)",display:"block",marginTop:12,marginBottom:4}}>こんな様子・行動が出る</label>
                <textarea value={row.behavior} onChange={e=>update(key,{behavior:e.target.value})}
                  rows={2} placeholder="例：早口になる・予定を詰めたくなる"
                  style={{...S.input,fontSize:13,resize:"vertical",lineHeight:1.5}}
                  onFocus={e=>e.target.style.borderColor=color} onBlur={e=>e.target.style.borderColor="var(--border)"}/>

                <label style={{fontSize:11,fontWeight:600,color:"var(--text-sub)",display:"block",marginTop:12,marginBottom:4}}>
                  わたしのセルフケア <span style={{color:"var(--text-muted)",fontWeight:400}}>（1行に1つ）</span>
                </label>
                <textarea defaultValue={selfCareText} key={key+"-sc"} onBlur={e=>updateSelfCareText(key,e.target.value)}
                  rows={Math.max(3,(row.selfCare||[]).length+1)}
                  placeholder={"例：\n深呼吸をする\n白湯を飲む\n短く横になる"}
                  style={{...S.input,fontSize:13,resize:"vertical",lineHeight:1.6}}
                  onFocus={e=>e.target.style.borderColor=color}/>
                <p style={{fontSize:10,color:"var(--text-muted)",marginTop:6}}>※ ここから外れると自動で保存されるよ</p>

                {/* プレビュー */}
                <div style={{marginTop:14}}>
                  <p style={{fontSize:10,fontWeight:600,color:"var(--text-muted)",letterSpacing:"0.05em",marginBottom:4}}>↓ きもちを記録した時に出る表示</p>
                  <StateCard score={score} compact/>
                </div>
              </div>
            )}
          </div>
        );
      })}
      </>)}
    </div>
  );
}

      icon: <svg width="64" height="64" viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="16" fill="#3E8E5A" opacity="0.15"/><text x="32" y="44" textAnchor="middle" fontSize="32" fill="#3E8E5A" fontFamily="sans-serif">✦</text></svg>,
      title:"セルフケアを見つけよう",
      body:"きもちを記録すると、その状態に合った「今日の手当て」が出てきます。\nやってみて「効いた？」を押すと、あなた専用の武器リストが育っていくよ。\nつらい時は「セルフケア」タブの『こんな時は？』から探せます。"
    },
    {
      icon: <svg width="64" height="64" viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="16" fill="#C05F38" opacity="0.15"/><text x="32" y="44" textAnchor="middle" fontSize="32" fill="#C05F38" fontFamily="sans-serif">🔒</text></svg>,
      title:"あなたのデータは安全です",
      body:"記録はすべて、あなたのスマホの中だけに保存されます。\nサーバーへの送信やアカウント登録は一切ありません。\n安心して使ってください。"
    }
  ];
  const p=pages[page];
  const isLast=page===pages.length-1;

  return(
    <div style={{
      position:"fixed",inset:0,zIndex:100,
      background:"var(--bg)",
      display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
      padding:24
    }}>
      <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",maxWidth:360,textAlign:"center",gap:20}}>
        {p.icon}
        <h1 style={{fontSize:22,fontWeight:700,color:"var(--text)",lineHeight:1.4}}>{p.title}</h1>
        <p style={{fontSize:14,color:"var(--text-sub)",lineHeight:1.8,whiteSpace:"pre-line"}}>{p.body}</p>
      </div>

      {/* ドットインジケーター */}
      <div style={{display:"flex",gap:8,marginBottom:24}}>
        {pages.map((_,i)=>(
          <div key={i} style={{
            width:i===page?24:8,height:8,borderRadius:4,
            background:i===page?"var(--accent)":"var(--border)",
            transition:"all 0.3s"
          }}/>
        ))}
      </div>

      {/* ボタン */}
      <div style={{display:"flex",gap:10,width:"100%",maxWidth:360}}>
        {page>0&&(
          <button onClick={()=>setPage(page-1)} style={{
            ...S.btn,flex:1,padding:"14px 0",borderRadius:12,
            background:"#F1F0EE",color:"var(--text-sub)",fontSize:15,fontWeight:500
          }}>もどる</button>
        )}
        <button onClick={()=>{
          if(isLast){localStorage.setItem(ONBOARDING_KEY,"1");onDone();}
          else setPage(page+1);
        }} style={{
          ...S.btn,flex:1,padding:"14px 0",borderRadius:12,
          background:"var(--accent)",color:"white",fontSize:15,fontWeight:600,
          boxShadow:"0 4px 16px rgba(192,95,56,0.3)"
        }}>{isLast?"始めよう！":"つぎへ"}</button>
      </div>

      {/* スキップ */}
      {!isLast&&(
        <button onClick={()=>{localStorage.setItem(ONBOARDING_KEY,"1");onDone();}}
          style={{...S.btn,background:"transparent",color:"var(--text-muted)",fontSize:12,marginTop:16,padding:"8px 16px"}}>
          スキップ
        </button>
      )}
    </div>
  );
}

// ═══════════════════════════════════════
// プライバシーバナー（設定タブ内にも常時表示）
// ═══════════════════════════════════════
function PrivacyBanner(){
  return(
    <div style={{
      ...S.card,padding:16,
      background:"linear-gradient(135deg, #EDF5E6 0%, #DDEBD2 100%)",
      border:"none"
    }}>
      <div style={{display:"flex",gap:10,alignItems:"flex-start"}}>
        <div style={{width:32,height:32,borderRadius:10,background:"rgba(62,142,90,0.18)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontSize:16}}>🔒</div>
        <div>
          <p style={{fontSize:12,fontWeight:700,color:"var(--text)",margin:"0 0 4px"}}>プライバシーについて</p>
          <p style={{fontSize:11,color:"var(--text-sub)",lineHeight:1.6,margin:0}}>
            あなたの記録はすべて、このスマホ（ブラウザ）の中だけに保存されます。
            インターネットに送信されることはありません。アカウント登録も不要です。
          </p>
        </div>
      </div>
    </div>
  );
}

// App
function App(){
  const[showOnboarding,setShowOnboarding]=useState(()=>!localStorage.getItem(ONBOARDING_KEY));
  const{state}=useDiaryCtx();
  const tab=()=>{switch(state.activeTab){case"home":return<HomeTab/>;case"calendar":return<CalendarTab/>;case"report":return<ReportTab/>;case"selfcare":return<SelfCareTab/>;case"settings":return<SettingsTab/>;}};
  if(showOnboarding) return <Onboarding onDone={()=>setShowOnboarding(false)}/>;
  return<Layout>{tab()}</Layout>;
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <React.StrictMode><DiaryProvider><App/></DiaryProvider></React.StrictMode>
);
</script>
